<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Preet Sports OBS Scoreboard - 1280x720</title>
<style>
/* =========================================================
   BASE RESET
========================================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #030814;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
}

.screen-wrapper {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* FLOATING URL CONTROL BAR */
.url-control-bar {
    position: absolute;
    top: 8px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(4, 14, 30, 0.95);
    border: 2px solid #00d2ff;
    border-radius: 30px;
    padding: 5px 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.85);
    width: 90%;
    max-width: 920px;
}
.url-control-bar span {
    color: #e0f2fe;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
}
.url-control-bar input {
    flex: 1;
    background: #081a33;
    border: 1px solid #00d2ff;
    border-radius: 18px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    outline: none;
}
.url-control-bar button {
    background: linear-gradient(180deg, #ff9f1c, #d35400);
    border: none;
    border-radius: 18px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 16px;
    cursor: pointer;
    white-space: nowrap;
}
.url-control-bar button:active {
    transform: scale(0.96);
}
.status-indicator {
    font-size: 11px;
    font-weight: bold;
    color: #00ffaa;
    white-space: nowrap;
}

/* =========================================================
   EXACT 1280 x 720 CANVAS (STADIUM GRAPHIC THEME)
========================================================= */
.scoreboard {
    position: relative;
    width: 1280px;
    height: 720px;
    min-width: 1280px;
    min-height: 720px;
    /* Stadium field backdrop simulation */
    background: 
        linear-gradient(180deg, rgba(2, 10, 24, 0.92) 0%, rgba(2, 10, 24, 0.3) 24%, rgba(2, 10, 24, 0.15) 50%, rgba(2, 10, 24, 0.7) 75%, rgba(1, 6, 16, 0.98) 100%),
        radial-gradient(ellipse 980px 340px at 50% 56%, #3a9134 0%, #1c5218 60%, #0d2811 100%),
        radial-gradient(circle at 50% 25%, #4fa3e3 0%, #153860 70%, #091728 100%);
    border: 3px solid #0b2545;
    box-shadow: 0 0 50px rgba(0,0,0,0.95);
    transform-origin: center center;
    flex-shrink: 0;
    overflow: hidden;
}

/* Light Streaks across Stadium Pitch */
.stadium-lights {
    position: absolute;
    left: 0;
    top: 180px;
    width: 100%;
    height: 280px;
    background: radial-gradient(ellipse at 50% 20%, rgba(0, 210, 255, 0.18) 0%, transparent 75%);
    pointer-events: none;
    z-index: 2;
}

/* =========================================================
   TOP SECTION (CHEVRON METALLIC PANELS + ORANGE GLOW)
========================================================= */
.top-header-frame {
    position: absolute;
    left: 0;
    top: 12px;
    width: 100%;
    height: 145px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 10;
}

/* Circular Team Crest Anchor */
.crest-circle-anchor {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 6px solid #d2dbe5;
    background: radial-gradient(circle at 35% 35%, #2a415a 0%, #0a1524 85%);
    box-shadow: 
        0 0 0 3px #112338,
        0 6px 20px rgba(0, 0, 0, 0.9),
        inset 0 0 18px rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
    z-index: 25;
}

.crest-circle-anchor img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

/* Team Pointed Chevron Bar */
.team-chevron-pod {
    flex: 1;
    height: 82px;
    background: linear-gradient(180deg, #18283e 0%, #0c1827 50%, #060e19 100%);
    border: 2px solid #3c5d82;
    border-radius: 8px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.85), 0 4px 18px rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
}

/* Horizontal Orange Neon Flare Line */
.team-chevron-pod::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 15%;
    width: 70%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff9f1c, #ffbf69, transparent);
    box-shadow: 0 0 8px #ff9f1c;
}

.team-chevron-pod.left-side {
    margin-left: -20px;
    padding-left: 32px;
    padding-right: 18px;
    clip-path: polygon(0% 0%, 93% 0%, 100% 50%, 93% 100%, 0% 100%);
    justify-content: space-between;
}

.team-chevron-pod.right-side {
    margin-right: -20px;
    padding-right: 32px;
    padding-left: 18px;
    clip-path: polygon(7% 0%, 100% 0%, 100% 100%, 7% 100%, 0% 50%);
    justify-content: space-between;
    flex-direction: row-reverse;
}

.team-info-block {
    display: flex;
    flex-direction: column;
}

.team-name-badge {
    background: #081423;
    border: 1.5px solid #00d2ff;
    border-radius: 5px;
    padding: 2px 10px;
    color: #ffffff;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: fit-content;
}

.badge-ball-icon {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff4d4d, #990000);
    border: 1px solid #ffffff;
    display: inline-block;
}

.team-overs-val {
    color: #8bbbe5;
    font-size: 13px;
    font-weight: 800;
    margin-top: 3px;
    letter-spacing: 0.8px;
}

.team-score-num {
    font-size: 46px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.4), 2px 2px 4px #000;
}

/* =========================================================
   CENTER NOTCHED SCREEN (ORANGE BEVEL & GLOW)
========================================================= */
.center-notched-pod {
    width: 250px;
    height: 105px;
    background: linear-gradient(180deg, #091729 0%, #030a13 100%);
    border: 3px solid #ff9f1c;
    border-radius: 20px;
    /* Notched polygon style like the image template */
    clip-path: polygon(
        12% 0%, 88% 0%, 100% 22%, 100% 78%, 88% 100%, 12% 100%, 0% 78%, 0% 22%
    );
    box-shadow: 
        0 0 28px rgba(255, 159, 28, 0.7),
        inset 0 0 20px rgba(0, 0, 0, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 30;
    margin: 0 8px;
}

.center-live-action {
    font-size: 50px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 0 16px rgba(255, 159, 28, 0.9), 2px 2px 4px #000;
}

.center-chase-equation {
    position: absolute;
    left: 0;
    right: 0;
    top: 146px;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    color: #ffbf69;
    letter-spacing: 0.5px;
    text-shadow: 0 0 10px rgba(255, 191, 105, 0.8), 2px 2px 4px #000;
    white-space: nowrap;
    z-index: 15;
}

/* =========================================================
   STATS BAR & OVERS TICKER (STREAMLINED METALLIC SLAB)
========================================================= */
.stats-ribbon-bar {
    position: absolute;
    left: 18px;
    right: 18px;
    top: 170px;
    height: 40px;
    background: linear-gradient(180deg, rgba(16, 32, 54, 0.92) 0%, rgba(7, 18, 32, 0.96) 100%);
    border: 1.5px solid #2a4c73;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 10;
}

.stat-cell {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 900;
    color: #ffffff;
}
.stat-cell .label {
    color: #ff9f1c;
    letter-spacing: 0.5px;
}

.ribbon-sep {
    width: 1.5px;
    height: 22px;
    background: #2a4c73;
}

/* OVERS MINI TICKER EMBEDDED IN RIBBON */
.overs-flow-box {
    display: flex;
    align-items: center;
    gap: 6px;
}
.over-col-title {
    color: #00d2ff;
    font-size: 14px;
    font-weight: 900;
}
.balls-cluster {
    display: flex;
    align-items: center;
    gap: 4px;
}
.ball-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #091729;
    border: 1.5px solid #6388b0;
    color: #ffffff;
    font-size: 12px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
}
.ball-dot.four { background: #0275d8; border-color: #70baff; }
.ball-dot.six { background: #029432; border-color: #6cf598; }
.ball-dot.wicket { background: #d90429; border-color: #ff8a9a; }
.ball-dot.extra { background: #d97706; border-color: #fed7aa; }

/* =========================================================
   BOTTOM PLAYER CARDS (METALLIC CARDS WITH TABS)
========================================================= */
.player-section {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 38px;
    height: 185px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    z-index: 10;
}

.player-card-pod {
    position: relative;
    height: 100%;
    border-radius: 12px;
    background: linear-gradient(180deg, #102844 0%, #091727 60%, #03080e 100%);
    border: 2px solid #2e5580;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
}

/* Bowler Orange Accent Pod */
.player-card-pod.bowler-style {
    background: linear-gradient(180deg, #38240f 0%, #1f1205 60%, #0a0501 100%);
    border-color: #8c561b;
}

/* Tab Header Cap */
.player-pill-tab {
    position: absolute;
    top: -18px;
    left: 20px;
    background: linear-gradient(180deg, #0088cc, #005580);
    border: 1.5px solid #63c0f2;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 2px 18px;
    font-size: 13px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
}

.player-pill-tab.bowler-tab {
    background: linear-gradient(180deg, #e67e22, #a85400);
    border-color: #ffb066;
}

.player-main-content {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    height: 100px;
}

/* Tall Rounded Rectangular Portrait Slot */
.player-rect-avatar {
    width: 82px;
    height: 110px;
    border-radius: 8px;
    border: 2.5px solid #d2dbe5;
    background: #02070e;
    overflow: hidden;
    margin-top: -30px;
    flex-shrink: 0;
    box-shadow: 0 4px 15px rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
}

.player-rect-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.player-text-data {
    flex: 1;
    margin-left: 12px;
    display: flex;
    flex-direction: column;
}

.player-name-text {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 2px 2px 4px #000;
}

.player-score-text {
    font-size: 26px;
    font-weight: 900;
    color: #ffbf69;
    margin-top: 2px;
    display: flex;
    align-items: center;
    text-shadow: 2px 2px 4px #000;
}

.icon-badge {
    margin-left: 8px;
    display: inline-flex;
    align-items: center;
}

.bat-svg {
    width: 22px;
    height: 22px;
    transform: rotate(-30deg);
}

.ball-svg {
    width: 20px;
    height: 20px;
}

/* Base Pill Strip For Sub-Stats */
.player-stat-strip {
    background: #02060b;
    border: 1.5px solid #1f3954;
    border-radius: 6px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    font-size: 14px;
    font-weight: 900;
    color: #8bbbe5;
}

.player-card-pod.bowler-style .player-stat-strip {
    border-color: #5c3914;
    color: #ffbf69;
}

.player-stat-strip .val {
    color: #ffffff;
}

/* =========================================================
   BOTTOM PROMO FOOTER
========================================================= */
.bottom-promo-footer {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 26px;
    background: linear-gradient(180deg, #0b1a2c 0%, #03080e 100%);
    border-top: 1.5px solid #ff9f1c;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
}

.bottom-promo-footer span {
    color: #ffbf69;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* =========================================================
   ANIMATIONS & OVERLAYS
========================================================= */
@keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.04); }
}

@keyframes scoreChange {
    0% { transform: scale(1); filter: brightness(1); }
    35% { transform: scale(1.18); filter: brightness(1.7); }
    100% { transform: scale(1); filter: brightness(1); }
}

@keyframes eventPop {
    0% { opacity: 0; transform: translate(-50%, 8px) scale(0.75); }
    10% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
    85% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -5px) scale(0.95); }
}

.live-badge {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px;
    border: 1.5px solid #ff9f1c;
    border-radius: 14px;
    background: rgba(3, 10, 20, 0.95);
    color: #ffffff;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
}

.live-badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff3030;
    animation: livePulse 1.25s infinite;
}

.score-change {
    animation: scoreChange 0.75s ease-out;
}

.match-status-flash {
    position: absolute;
    left: 50%;
    top: 310px;
    transform: translateX(-50%);
    z-index: 50;
    min-width: 250px;
    max-width: 600px;
    padding: 10px 24px;
    border: 2px solid #ff9f1c;
    border-radius: 10px;
    background: rgba(3, 10, 20, 0.94);
    color: #fff;
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    display: none;
    white-space: nowrap;
}
.match-status-flash.show {
    display: block;
}

.event-flash {
    position: absolute;
    left: 50%;
    top: 310px;
    transform: translateX(-50%);
    z-index: 80;
    display: none;
    min-width: 240px;
    padding: 10px 26px;
    border: 3px solid #ff9f1c;
    border-radius: 16px;
    background: rgba(3, 10, 20, 0.96);
    color: #ffffff;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1.8px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255, 159, 28, 0.6);
}
.event-flash.show {
    display: block;
    animation: eventPop 4.5s ease-in-out forwards;
}
.event-flash.four { border-color: #70baff; color: #dff2ff; }
.event-flash.six { border-color: #6cf598; color: #d9ffe8; }
.event-flash.wide { border-color: #00d9ff; color: #00d9ff; }
.event-flash.noball { border-color: #ff8a00; color: #ff8a00; }
.event-flash.wicket { border-color: #ff6b7d; color: #ffdbe0; }
</style>
</head>

<body>

<div class="screen-wrapper">

    <!-- FLOATING CONTROL BAR -->
    <div class="url-control-bar" id="urlControlBar">
        <span>CREX MATCH:</span>
        <input type="text" id="crexUrlInput" placeholder="Paste CREX URL or Match ID...">
        <button id="loadMatchUrlBtn">LOAD MATCH</button>
        <button id="generateObsBtn">COPY OBS URL</button>
        <span class="status-indicator" id="statusIndicator">Ready</span>
    </div>

    <!-- 1280x720 BOARD CANVAS -->
    <div class="scoreboard" id="scoreboardCanvas">

        <div class="stadium-lights"></div>

        <div class="live-badge">
            <span class="live-badge-dot"></span>
            <span>LIVE</span>
        </div>

        <div id="eventFlash" class="event-flash"></div>
        <div id="matchStatusFlash" class="match-status-flash"></div>

        <!-- TOP BAR SECTION -->
        <div class="top-header-frame">

            <!-- LEFT CREST -->
            <div class="crest-circle-anchor">
                <img id="team1Logo" src="" alt="Team 1 Logo">
            </div>

            <!-- TEAM 1 (LEFT SCORE CHEVRON) -->
            <div class="team-chevron-pod left-side">
                <div class="team-info-block">
                    <div class="team-name-badge" id="team1BadgeBox">
                        <span id="team1BallIcon" class="badge-ball-icon" style="display: none;"></span>
                        <span id="team1Badge">AUS</span>
                    </div>
                    <div class="team-overs-val" id="team1Overs">OVERS: 0.0</div>
                </div>
                <div class="team-score-num" id="team1Score">-</div>
            </div>

            <!-- CENTER NOTCHED EVENT MONITOR -->
            <div class="center-notched-pod">
                <div id="centerLiveAction" class="center-live-action">•</div>
            </div>

            <!-- TEAM 2 (RIGHT SCORE CHEVRON) -->
            <div class="team-chevron-pod right-side">
                <div class="team-info-block" style="align-items: flex-end;">
                    <div class="team-name-badge" id="team2BadgeBox">
                        <span id="team2BallIcon" class="badge-ball-icon" style="display: none;"></span>
                        <span id="team2Badge">IND</span>
                    </div>
                    <div class="team-overs-val" id="team2Overs">OVERS: 0.0</div>
                </div>
                <div class="team-score-num" id="team2Score">-</div>
            </div>

            <!-- RIGHT CREST -->
            <div class="crest-circle-anchor">
                <img id="team2Logo" src="" alt="Team 2 Logo">
            </div>

        </div>

        <!-- CHASE EQUATION -->
        <div id="centerChaseEquation" class="center-chase-equation" style="display: none;"></div>

        <!-- MID STATS & RECENT OVERS RIBBON -->
        <div class="stats-ribbon-bar">
            <div class="stat-cell"><span class="label">CRR:</span> <span id="crr">--</span></div>
            <div class="ribbon-sep"></div>
            <div class="stat-cell"><span class="label">RRR:</span> <span id="rrr">--</span></div>
            <div class="ribbon-sep"></div>
            <div class="stat-cell"><span class="label">PARTNERSHIP:</span> <span id="partnership">--</span></div>
            <div class="ribbon-sep"></div>
            <div class="stat-cell"><span class="label">TARGET:</span> <span id="target">--</span></div>
            <div class="ribbon-sep"></div>
            <!-- Dynamic Recent Overs Segment -->
            <div id="oversTicker" class="overs-flow-box">
                <span class="over-col-title">OVERS:</span>
                <div class="balls-cluster">
                    <span class="ball-dot">•</span>
                </div>
            </div>
        </div>

        <!-- BOTTOM PLAYERS SECTION -->
        <div class="player-section">

            <!-- BATTER 1 -->
            <div class="player-card-pod">
                <div class="player-pill-tab">BATSMAN</div>
                <div class="player-main-content">
                    <div class="player-rect-avatar">
                        <img id="player1Image" src="" alt="">
                    </div>
                    <div class="player-text-data">
                        <div id="player1Name" class="player-name-text">Batter 1</div>
                        <div class="player-score-text">
                            <span id="player1Score">-</span>
                            <span id="b1BatIcon" class="icon-badge" style="display: none;">
                                <svg class="bat-svg" viewBox="0 0 32 32">
                                    <rect x="14.5" y="1" width="3" height="10" rx="1.5" fill="#f8f9fa" stroke="#222" stroke-width="0.8"/>
                                    <line x1="14.5" y1="3" x2="17.5" y2="3" stroke="#e63946" stroke-width="1.2"/>
                                    <line x1="14.5" y1="6" x2="17.5" y2="6" stroke="#e63946" stroke-width="1.2"/>
                                    <path d="M13.5 11 L18.5 11 L19 28 C19 30 13 30 13 28 Z" fill="#d4a373" stroke="#78350f" stroke-width="1.2"/>
                                    <path d="M15.5 12 L16.5 12 L16.5 28 L15.5 28 Z" fill="#b08968" opacity="0.6"/>
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="player-stat-strip">
                    <span>4s: <span class="val" id="b1Fours">(0)</span></span>
                    <span>6s: <span class="val" id="b1Sixes">(0)</span></span>
                    <span>SR: <span class="val" id="b1SR">0.00</span></span>
                </div>
            </div>

            <!-- BATTER 2 -->
            <div class="player-card-pod">
                <div class="player-pill-tab">BATSMAN</div>
                <div class="player-main-content">
                    <div class="player-rect-avatar">
                        <img id="player2Image" src="" alt="">
                    </div>
                    <div class="player-text-data">

<script>
function fitScoreboardToWindow() {
    const el = document.getElementById("scoreboardCanvas");
    if (!el) return;

    const targetW = 1280;
    const targetH = 720;
    const winW = window.innerWidth || document.documentElement.clientWidth || 1280;
    const winH = window.innerHeight || document.documentElement.clientHeight || 720;

    if (winW <= 0 || winH <= 0) return;

    const scale = Math.min(winW / targetW, winH / targetH);
    const finalScale = (!isNaN(scale) && scale > 0.05) ? scale : 1;

    el.style.transformOrigin = "center center";
    el.style.transform = `scale(${finalScale})`;
}

window.addEventListener("resize", fitScoreboardToWindow);
window.addEventListener("orientationchange", fitScoreboardToWindow);
document.addEventListener("DOMContentLoaded", fitScoreboardToWindow);
fitScoreboardToWindow();

const API_BASE = "https://preet-sports.onrender.com";

const urlParams = new URLSearchParams(window.location.search);
const OBS_TOKEN = urlParams.get("token") || "";

function cleanCrexUrl(url) {
    if (!url) return "";
    let clean = url.trim().replace(/\.+$/, "");
    clean = clean.split("#")[0];
    clean = clean.split("?")[0];
    return clean.trim();
}

function normalizeInput(val) {
    if (!val) return "";
    let clean = cleanCrexUrl(val);
    if (!clean.startsWith("http") && clean.length <= 8) {
        clean = `https://crex.com/cricket-live-score/match-updates-${clean.toUpperCase()}`;
    }
    return clean;
}

let activeTargetUrl = localStorage.getItem("crex_match_input") || "";
const urlInput = document.getElementById("crexUrlInput");
const statusInd = document.getElementById("statusIndicator");
if (urlInput) urlInput.value = activeTargetUrl;

function flushDomElementsInstantly() {
    document.getElementById("team1Score").textContent = "-";
    document.getElementById("team2Score").textContent = "-";
    document.getElementById("team1Overs").textContent = "OVERS: 0.0";
    document.getElementById("team2Overs").textContent = "OVERS: 0.0";
    document.getElementById("centerLiveAction").textContent = "•";
    document.getElementById("centerChaseEquation").style.display = "none";
    document.getElementById("crr").textContent = "--";
    document.getElementById("rrr").textContent = "--";
    document.getElementById("partnership").textContent = "--";
    document.getElementById("target").textContent = "--";
    document.getElementById("player1Name").textContent = "Batter 1";
    document.getElementById("player1Score").textContent = "-";
    document.getElementById("b1Fours").textContent = "(0)";
    document.getElementById("b1Sixes").textContent = "(0)";
    document.getElementById("b1SR").textContent = "0.00";
    document.getElementById("b1BatIcon").style.display = "none";
    document.getElementById("player2Name").textContent = "Batter 2";
    document.getElementById("player2Score").textContent = "-";
    document.getElementById("b2Fours").textContent = "(0)";
    document.getElementById("b2Sixes").textContent = "(0)";
    document.getElementById("b2SR").textContent = "0.00";
    document.getElementById("b2BatIcon").style.display = "none";
    document.getElementById("bowlerName").textContent = "Bowler";
    document.getElementById("bowlerScore").textContent = "-";
    document.getElementById("bowlerEcon").textContent = "0.00";
}

function renderImageInCircle(elementId, imageUrl) {
    const el = document.getElementById(elementId);
    if (!el) return;
    if (imageUrl && typeof imageUrl === "string" && imageUrl.startsWith("http")) {
        let highResUrl = imageUrl.replace(/(\?|&)(w|width|h|height)=\d+/gi, "");
        el.src = highResUrl;
        el.style.display = "block";
        el.onerror = () => { el.style.display = "none"; };
    } else {
        el.style.display = "none";
    }
}

let fetchInProgress = false;
let retryTimer = null;
let lastSuccessfulData = null;
let lastSuccessfulTimestamp = 0;
let previousTeam1Score = null;
let previousTeam2Score = null;
let previousBallSignature = null;
let previousEventSignature = null;
let firstLiveRender = true;
let eventHideTimer = null;

const POLL_INTERVAL = 3000;
const REQUEST_TIMEOUT = 15000;

function renderOversTicker(recentOvers, lastWicket) {
    const ticker = document.getElementById("oversTicker");
    if (!ticker) return;
    ticker.innerHTML = "";

    const overs = Array.isArray(recentOvers) ? recentOvers.slice(-1) : [];
    const latestOver = overs[0];

    const overCol = document.createElement("div");
    overCol.className = "overs-flow-box";

    const title = document.createElement("span");
    title.className = "over-col-title";
    const overLabel = String(latestOver && (latestOver.label ?? latestOver.over ?? "")).trim();
    title.textContent = `${overLabel || "OVER"}:`;
    overCol.appendChild(title);

    const cluster = document.createElement("div");
    cluster.className = "balls-cluster";

    const balls = Array.isArray(latestOver && latestOver.balls) ? latestOver.balls : [];
    balls.forEach((b) => {
        const dot = document.createElement("span");
        dot.className = "ball-dot";

        const ballText = String(b && typeof b === "object" ? (b.text ?? b.value ?? "") : (b ?? "")).trim();
        const ballType = String(b && typeof b === "object" ? (b.type ?? "") : "").trim().toLowerCase();

        dot.textContent = ballText || "•";

        if (ballType === "four" || ballText === "4") dot.classList.add("four");
        else if (ballType === "six" || ballText === "6") dot.classList.add("six");
        else if (ballType === "wicket" || ballText.toUpperCase() === "W") dot.classList.add("wicket");
        else if (ballType === "extra" || ballType === "wide" || ballType === "no-ball") dot.classList.add("extra");

        cluster.appendChild(dot);
    });

    overCol.appendChild(cluster);

    if (lastWicket) {
        const lw = document.createElement("span");
        lw.style.marginLeft = "12px";
        lw.style.color = "#ff9f1c";
        lw.style.fontSize = "13px";
        lw.style.fontWeight = "900";
        lw.textContent = `LAST WKT: ${lastWicket}`;
        overCol.appendChild(lw);
    }

    ticker.appendChild(overCol);
}

function cacheKeyForUrl(url) {
    return "preet_sports_last_score_" + btoa(encodeURIComponent(url || "default")).replace(/[^a-zA-Z0-9_-]/g, "_");
}

function saveLastSuccessfulData(data) {
    try {
        lastSuccessfulData = data;
        lastSuccessfulTimestamp = Date.now();
        const key = cacheKeyForUrl(activeTargetUrl);
        localStorage.setItem(key, JSON.stringify({
            timestamp: lastSuccessfulTimestamp,
            data: data
        }));
    } catch (e) {}
}

function restoreLastSuccessfulData() {
    try {
        const key = cacheKeyForUrl(activeTargetUrl);
        const raw = localStorage.getItem(key);
        if (!raw) return false;

        const cached = JSON.parse(raw);
        if (!cached || !cached.data || cached.data.success === false) return false;

        lastSuccessfulData = cached.data;
        lastSuccessfulTimestamp = Number(cached.timestamp || 0);

        renderScoreData(lastSuccessfulData, true);
        return true;
    } catch (e) {
        return false;
    }
}

function scheduleNextFetch(delay = POLL_INTERVAL) {
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(() => {
        retryTimer = null;
        fetchScores();
    }, delay);
}

function setConnectionStatus(text, color) {
    if (!statusInd) return;
    statusInd.textContent = text;
    statusInd.style.color = color;
    statusInd.title = text;
}

function animateElementByClass(id, className) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove(className);
    void el.offsetWidth;
    el.classList.add(className);
    setTimeout(() => el.classList.remove(className), 900);
}

function scoreRuns(score) {
    const m = String(score || "").match(/^\s*(\d+)/);
    return m ? Number(m[1]) : null;
}

function showMatchStatus(statusText) {
    const el = document.getElementById("matchStatusFlash");
    if (!el) return;
    const text = String(statusText || "").trim();

    if (!text) {
        el.textContent = "";
        el.classList.remove("show");
        return;
    }

    el.textContent = text;
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
}

function showEventFlash(label, type) {
    const el = document.getElementById("eventFlash");
    if (!el || !label) return;

    if (eventHideTimer) {
        clearTimeout(eventHideTimer);
        eventHideTimer = null;
    }

    el.className = "event-flash";
    el.textContent = label;
    if (type) el.classList.add(type);

    void el.offsetWidth;
    el.classList.add("show");

    eventHideTimer = setTimeout(() => {
        el.classList.remove("show");
        eventHideTimer = null;
    }, 4500);
}

function renderScoreData(data, fromCache = false) {
    if (!data || data.success === false) {
        throw new Error("Invalid score data");
    }

    const liveStatusText = String(data.status ?? data.match_status ?? data.live_status ?? "").trim();
    const normalizedStatus = liveStatusText.toLowerCase();

    if (
        normalizedStatus.includes("innings break") ||
        normalizedStatus.includes("match end") ||
        normalizedStatus.includes("match ended") ||
        normalizedStatus.includes("stumps") ||
        normalizedStatus.includes("rain") ||
        normalizedStatus.includes("delay") ||
        normalizedStatus.includes("abandoned") ||
        normalizedStatus.includes("tea") ||
        normalizedStatus.includes("lunch")
    ) {
        showMatchStatus(liveStatusText);
    } else {
        showMatchStatus("");
    }

    const apiTeam1 = (data.team1 && typeof data.team1 === "object") ? data.team1 : {};
    const apiTeam2 = (data.team2 && typeof data.team2 === "object") ? data.team2 : {};

    const t1Name = String(apiTeam1.full_name || apiTeam1.short || (typeof data.team1 === "string" ? data.team1 : "") || "TEAM 1").toUpperCase();
    let t2Name = String(apiTeam2.full_name || apiTeam2.short || (typeof data.team2 === "string" ? data.team2 : "") || "TEAM 2").toUpperCase();

    const abbreviation = (name) => {
        const n = String(name || "").toUpperCase();
        if (n.includes("AUSTRALIA") || n.includes("AUSCH")) return "AUS";
        if (n.includes("INDIA") || n.includes("INDCH")) return "IND";
        if (n.includes("SOUTH AFRICA")) return "SA";
        if (n.includes("ENGLAND")) return "ENG";
        if (n.includes("SRI LANKA")) return "SL";
        if (n.includes("NEW ZEALAND")) return "NZ";
        if (n.includes("PAKISTAN")) return "PAK";
        if (n.includes("WEST INDIES")) return "WI";
        if (n.includes("ZIMBABWE")) return "ZIM";
        return n.length <= 8 ? n : n.split(/\s+/).map(x => x[0]).join("").slice(0, 4);
    };

    const t1Badge = abbreviation(t1Name);
    const t2Badge = abbreviation(t2Name);

    const equationText = String(data.equation || data.status || "").trim();
    const australiaBowling = /AUS\s+opt\s+to\s+Bowl/i.test(equationText);

    let t1Score = apiTeam1.score ? String(apiTeam1.score).replace("/", "-") : "0-0";
    let t1Overs = apiTeam1.overs ? String(apiTeam1.overs).replace(/[()]/g, "") : "0.0";
    let t2Score = apiTeam2.score ? String(apiTeam2.score).replace("/", "-") : "0-0";
    let t2Overs = apiTeam2.overs ? String(apiTeam2.overs).replace(/[()]/g, "") : "0.0";

    if (!fromCache && !firstLiveRender) {
        const old1 = scoreRuns(previousTeam1Score);
        const old2 = scoreRuns(previousTeam2Score);
        const new1 = scoreRuns(t1Score);
        const new2 = scoreRuns(t2Score);

        if (old1 !== null && new1 !== null && old1 !== new1) animateElementByClass("team1Score", "score-change");
        if (old2 !== null && new2 !== null && old2 !== new2) animateElementByClass("team2Score", "score-change");
    }

    let t1Role = "BOWLING";
    let t2Role = "BATTING";

    if (australiaBowling) {
        t1Role = "BATTING";
        t2Role = "BOWLING";
        if (t2Score === t1Score) {
            t2Score = "Yet to bat";
            t2Overs = "Yet to bat";
        }
    } else if (/SA\s+opt\s+to\s+Bowl/i.test(equationText)) {
        t1Role = "BOWLING";
        t2Role = "BATTING";
        if (t1Score === t2Score) {
            t1Score = "Yet to bat";
            t1Overs = "Yet to bat";
        }
    }

    renderImageInCircle("team1Logo", apiTeam1.logo || data.team1Logo);
    renderImageInCircle("team2Logo", apiTeam2.logo || data.team2Logo);

    document.getElementById("team1Badge").textContent = t1Badge;
    document.getElementById("team1Score").textContent = t1Score;
    document.getElementById("team1Overs").textContent = `OVERS: ${t1Overs}`;
    document.getElementById("team1BallIcon").style.display = (t1Role === "BOWLING") ? "inline-block" : "none";

    document.getElementById("team2Badge").textContent = t2Badge;
    document.getElementById("team2Score").textContent = t2Score;
    document.getElementById("team2Overs").textContent = `OVERS: ${t2Overs}`;
    document.getElementById("team2BallIcon").style.display = (t2Role === "BOWLING") ? "inline-block" : "none";

    const actionEl = document.getElementById("centerLiveAction");
    const latestBallObject = Array.isArray(data.current_over?.balls) && data.current_over.balls.length
        ? data.current_over.balls[data.current_over.balls.length - 1]
        : null;

    const ballText = String(latestBallObject && typeof latestBallObject === "object" ? (latestBallObject.text ?? "") : (latestBallObject ?? data.last_ball ?? data.liveBall ?? "")).trim();
    const ballType = String(latestBallObject && typeof latestBallObject === "object" ? (latestBallObject.type ?? "") : "").trim();

    const currentOverLabel = String(data.current_over?.label || "");
    const eventSignature = [currentOverLabel, ballText, ballType, String(t1Score), String(t2Score)].join("|");

    let eventLabel = "";
    let eventType = "";
    const normalizedBallText = ballText.toLowerCase().replace(/[\s-]/g, "");
    const normalizedBallType = ballType.toLowerCase().replace(/[\s-]/g, "");

    if (!fromCache && !firstLiveRender && eventSignature !== previousEventSignature) {
        if (normalizedBallType === "four" || normalizedBallText === "4") {
            eventLabel = "FOUR!";
            eventType = "four";
        } else if (normalizedBallType === "six" || normalizedBallText === "6") {
            eventLabel = "SIX!";
            eventType = "six";
        } else if (
            normalizedBallType === "wicket" ||
            normalizedBallText === "w" ||
            normalizedBallText === "1w" ||
            /wicket/i.test(String(data.last_event || data.live_event || ""))
        ) {
            eventLabel = "WICKET!";
            eventType = "wicket";
        } else if (
            normalizedBallText === "wd" ||
            normalizedBallText.startsWith("wd") ||
            normalizedBallType === "wide" ||
            normalizedBallType === "wideball"
        ) {
            eventLabel = "WIDE!";
            eventType = "wide";
        } else if (
            normalizedBallText === "nb" ||
            normalizedBallText.endsWith("nb") ||
            normalizedBallType === "noball" ||
            normalizedBallType === "no-ball"
        ) {
            eventLabel = "NO BALL!";
            eventType = "noball";
        }
    }

    if (eventLabel) {
        showEventFlash(eventLabel, eventType);
    }

    previousEventSignature = eventSignature;

    let actionText = ballText || data.last_event || data.live_event || "•";
    actionText = String(actionText).trim();

    const eventUpper = actionText.toUpperCase();
    if (eventUpper.includes("RUN OUT")) actionText = "RUN OUT";
    else if (eventUpper === "WICKET") actionText = "W";
    else if (eventUpper === "WIDE") actionText = "WD";
    else if (eventUpper === "NO BALL" || eventUpper === "NO-BALL") actionText = "NB";
    else if (eventUpper === "FOUR") actionText = "4";
    else if (eventUpper === "SIX") actionText = "6";
    else if (actionText.length > 8) actionText = ballText || "•";

    actionEl.textContent = actionText || "•";
    if (actionText === "RUN OUT") {
        actionEl.style.fontSize = "30px";
    } else if (String(actionText).length <= 2) {
        actionEl.style.fontSize = "52px";
    } else {
        actionEl.style.fontSize = "36px";
    }

    const chaseEl = document.getElementById("centerChaseEquation");
    chaseEl.textContent = equationText || "";
    chaseEl.style.display = equationText ? "block" : "none";

    const recentOvers = Array.isArray(data.structured_overs) ? data.structured_overs : (data.recentOvers || []);
    renderOversTicker(recentOvers, data.last_wicket);

    document.getElementById("crr").textContent = data.crr ?? "--";
    document.getElementById("rrr").textContent = data.rrr ?? "--";
    document.getElementById("partnership").textContent = data.partnership || "--";
    document.getElementById("target").textContent = (data.target && data.target !== "") ? data.target : "--";

    const b1 = data.batsman1 || data.batter1;
    const b2 = data.batsman2 || data.batter2;

    if (b1) {
        document.getElementById("player1Name").textContent = b1.short_name || b1.name || "Batter 1";
        document.getElementById("player1Score").textContent = `${b1.runs ?? 0} (${b1.balls ?? 0})`;
        document.getElementById("b1Fours").textContent = `(${b1.fours ?? 0})`;
        document.getElementById("b1Sixes").textContent = `(${b1.sixes ?? 0})`;
        document.getElementById("b1SR").textContent = b1.sr ?? "0.00";
        document.getElementById("b1BatIcon").style.display = b1.on_strike ? "inline-flex" : "none";
        renderImageInCircle("player1Image", b1.img || b1.image);
    }

    if (b2) {
        document.getElementById("player2Name").textContent = b2.short_name || b2.name || "Batter 2";
        document.getElementById("player2Score").textContent = `${b2.runs ?? 0} (${b2.balls ?? 0})`;
        document.getElementById("b2Fours").textContent = `(${b2.fours ?? 0})`;
        document.getElementById("b2Sixes").textContent = `(${b2.sixes ?? 0})`;
        document.getElementById("b2SR").textContent = b2.sr ?? "0.00";
        document.getElementById("b2BatIcon").style.display = b2.on_strike ? "inline-flex" : "none";
        renderImageInCircle("player2Image", b2.img || b2.image);
    }

    if (data.bowler) {
        const bowler = data.bowler;
        document.getElementById("bowlerName").textContent = bowler.short_name || bowler.name || "Bowler";
        document.getElementById("bowlerScore").textContent = bowler.figures || "-";
        document.getElementById("bowlerEcon").textContent = bowler.econ || "0.00";
        renderImageInCircle("bowlerImage", bowler.img || bowler.image);
    }

    if (!fromCache) {
        previousTeam1Score = t1Score;
        previousTeam2Score = t2Score;
        firstLiveRender = false;
    }

    if (fromCache) {
        setConnectionStatus("Cached • Reconnecting...", "#ffbf69");
    }
}

async function fetchScores() {
    if (fetchInProgress) return;

    fetchInProgress = true;
    setConnectionStatus("SYNCING LIVE DATA...", "#ffbf69");

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

    try {
        let fetchEndpoint = "";
        if (OBS_TOKEN) {
            fetchEndpoint = `${API_BASE}/api/obs/${encodeURIComponent(OBS_TOKEN)}/scrape?t=${Date.now()}`;
        } else if (activeTargetUrl) {
            fetchEndpoint = `${API_BASE}/api/scrape?url=${encodeURIComponent(activeTargetUrl)}&t=${Date.now()}`;
        } else {
            setConnectionStatus("AWAITING URL", "#ffbf69");
            return;
        }

        const res = await fetch(fetchEndpoint, {
            method: "GET",
            cache: "no-store",
            mode: "cors",
            signal: controller.signal,
            headers: {
                "Accept": "application/json",
                "Cache-Control": "no-cache"
            }
        });

        const rawText = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${rawText.slice(0, 100)}`);

        let data;
        try {
            data = JSON.parse(rawText);
        } catch (e) {
            throw new Error(`API non-JSON: ${rawText.slice(0, 100)}`);
        }

        if (!data || data.success !== true) {
            throw new Error(data?.error || "Invalid response");
        }

        renderScoreData(data, false);
        saveLastSuccessfulData(data);
        setConnectionStatus("LIVE • SYNCED", "#00ffaa");

    } catch (err) {
        const msg = err?.message || "Network error";
        if (err?.name === "AbortError") {
            setConnectionStatus("RETRYING • TIMEOUT", "#ffbf69");
        } else {
            setConnectionStatus("RETRYING...", "#ffbf69");
        }
    } finally {
        clearTimeout(timeoutId);
        fetchInProgress = false;
        scheduleNextFetch(POLL_INTERVAL);
    }
}

async function triggerMatchLoad() {
    let rawVal = urlInput.value.trim();
    if (!rawVal) {
        alert("Please enter a valid CREX URL or Match ID");
        return;
    }

    const target = normalizeInput(rawVal);
    activeTargetUrl = target;
    localStorage.setItem("crex_match_input", target);
    urlInput.value = target;

    if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
    }

    flushDomElementsInstantly();
    restoreLastSuccessfulData();
    setConnectionStatus("CONNECTING...", "#ffbf69");

    try {
        await fetch(`${API_BASE}/api/default-url`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: target })
        });
    } catch (e) {}

    fetchScores();
}

document.getElementById("loadMatchUrlBtn").addEventListener("click", triggerMatchLoad);

document.getElementById("generateObsBtn").addEventListener("click", async () => {
    const crexUrl = normalizeInput(urlInput.value.trim());
    if (!crexUrl) {
        alert("Please paste a valid CREX match URL first.");
        return;
    }

    try {
        setConnectionStatus("GENERATING OBS LINK...", "#ffbf69");

        const response = await fetch(`${API_BASE}/api/obs-token`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ url: crexUrl })
        });

        const data = await response.json();
        if (!response.ok || !data.success || !data.token) {
            throw new Error(data.error || "Unable to generate OBS URL");
        }

        const obsUrl = `${window.location.origin}${window.location.pathname}?token=${encodeURIComponent(data.token)}&hide=1`;

        try {
            await navigator.clipboard.writeText(obsUrl);
        } catch (clipboardError) {
            const temp = document.createElement("textarea");
            temp.value = obsUrl;
            temp.style.position = "fixed";
            temp.style.left = "-9999px";
            document.body.appendChild(temp);
            temp.focus();
            temp.select();
            document.execCommand("copy");
            temp.remove();
        }

        setConnectionStatus("OBS URL COPIED ✓", "#00ffaa");
        alert("OBS Browser Source URL copied to clipboard:\n\n" + obsUrl);

    } catch (error) {
        setConnectionStatus("OBS LINK ERROR", "#ff6b6b");
        alert("Could not generate OBS URL: " + (error.message || "Unknown error"));
    }
});

urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") triggerMatchLoad();
});

if (urlParams.get("hide") === "1") {
    document.getElementById("urlControlBar").style.display = "none";
}

window.addEventListener("load", () => {
    const restored = restoreLastSuccessfulData();
    if (restored) {
        setConnectionStatus("Cached • Connecting...", "#ffbf69");
    } else {
        setConnectionStatus("Ready", "#ffbf69");
    }
    if (activeTargetUrl || OBS_TOKEN) {
        fetchScores();
    }
});
</script>
