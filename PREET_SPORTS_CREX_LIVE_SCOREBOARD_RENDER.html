<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Preet Sports OBS Scoreboard - 1280x720</title>
<style>
/* =========================================================
   BASE RESET & CANVAS SETUP
========================================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #030811;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
}

.screen-wrapper {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* FLOATING URL CONTROL BAR */
.url-control-bar {
    position: absolute;
    top: 8px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(4, 15, 29, 0.95);
    border: 2px solid #ff9d00;
    border-radius: 30px;
    padding: 5px 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.85);
    width: 90%;
    max-width: 920px;
}
.url-control-bar span {
    color: #ffb834;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
}
.url-control-bar input {
    flex: 1;
    background: #081d38;
    border: 1px solid #00a8ff;
    border-radius: 18px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    outline: none;
}
.url-control-bar button {
    background: linear-gradient(180deg, #ff9f05, #c76500);
    border: none;
    border-radius: 18px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 16px;
    cursor: pointer;
    white-space: nowrap;
}
.url-control-bar button:active {
    transform: scale(0.96);
}
.status-indicator {
    font-size: 11px;
    font-weight: bold;
    color: #6cf598;
    white-space: nowrap;
}

/* =========================================================
   EXACT 1280 x 720 CANVAS - STEEL BLUE CYBER BROADCAST THEME
========================================================= */
.scoreboard {
    position: relative;
    width: 1280px;
    height: 720px;
    min-width: 1280px;
    min-height: 720px;
    background: 
        radial-gradient(ellipse 950px 320px at 50% 50%, rgba(0, 110, 80, 0.28) 0%, transparent 80%),
        radial-gradient(circle at 50% 50%, #06182c 0%, #02070e 100%);
    border: 2px solid #3d6085;
    box-shadow: 0 0 50px rgba(0,0,0,0.95);
    transform-origin: center center;
    flex-shrink: 0;
    overflow: hidden;
}

/* STADIUM BG GRAPHIC OVERLAY */
.stadium-overlay {
    position: absolute;
    left: 0;
    top: 240px;
    width: 100%;
    height: 250px;
    pointer-events: none;
    background: radial-gradient(ellipse 700px 180px at 50% 50%, #2f8538 0%, #154e1a 50%, transparent 95%);
    opacity: 0.35;
    filter: blur(4px);
    z-index: 1;
}

/* =========================================================
   TOP HEADER BAR & CHEVRONS
========================================================= */
.top-header-frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 190px;
    background: linear-gradient(180deg, #010b17 0%, #07192f 50%, #010c18 100%);
    border-bottom: 3px solid #14355a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 10;
}

/* TEAM BANNER CONTAINER */
.team-deck {
    display: flex;
    align-items: center;
    width: 485px;
    height: 140px;
    position: relative;
}

.team-deck.right-side {
    justify-content: flex-end;
}

/* CIRCULAR CREST WITH MULTI-LAYER CHROME RING & MESH */
.team-crest-box {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: radial-gradient(circle, #0e2747 0%, #051427 80%, #020a16 100%);
    border: 6px solid #b8cadc;
    box-shadow: 
        0 0 0 3px #1a395b,
        0 8px 25px rgba(0,0,0,0.85),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
}

.team-crest-box::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 60%);
    pointer-events: none;
}

.team-logo-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #020914;
    border: 2px solid #5784b1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.team-logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

/* ANGLED CHEVRON SCORE POD */
.team-score-pod {
    flex: 1;
    height: 80px;
    background: linear-gradient(180deg, #10243d 0%, #06162a 50%, #030d1a 100%);
    border: 2px solid #4a75a0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    position: relative;
    box-shadow: inset 0 0 18px rgba(0,0,0,0.85), 0 6px 18px rgba(0,0,0,0.7);
}

/* Left Chevron Point */
.team-deck.left-side .team-score-pod {
    margin-left: -24px;
    padding-left: 36px;
    clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
    border-right: none;
}

/* Right Chevron Point */
.team-deck.right-side .team-score-pod {
    margin-right: -24px;
    padding-right: 36px;
    clip-path: polygon(12% 0, 100% 0, 100% 100%, 12% 100%, 0 50%);
    border-left: none;
}

/* Orange Glow Light Strips on top and bottom of chevron */
.team-score-pod::before {
    content: "";
    position: absolute;
    top: -2px;
    left: 20%;
    width: 60%;
    height: 3px;
    background: #ff9d00;
    box-shadow: 0 0 12px #ff9d00, 0 0 20px #ff7700;
}
.team-score-pod::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 20%;
    width: 60%;
    height: 3px;
    background: #ff9d00;
    box-shadow: 0 0 12px #ff9d00, 0 0 20px #ff7700;
}

.team-meta-stack {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.team-badge-pill {
    color: #00d2ff;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
}

.badge-ball-icon {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff4d4d, #990000);
    border: 1px solid #ffffff;
    display: inline-block;
}

.team-overs-pill {
    color: #9cb8d6;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
}

.team-big-score {
    font-size: 46px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(255,255,255,0.4), 2px 2px 4px #000;
}

/* =========================================================
   CENTER NOTCHED CYBER MONITOR
========================================================= */
.center-event-monitor {
    width: 250px;
    height: 104px;
    background: linear-gradient(180deg, #091c33 0%, #04101e 100%);
    border: 3px solid #ff9d00;
    /* Chamfered Octagonal / Notched Polygon matching the image */
    clip-path: polygon(
        18px 0%, calc(100% - 18px) 0%, 
        100% 18px, 100% 32px, 
        calc(100% - 10px) 42px, calc(100% - 10px) 62px, 
        100% 72px, 100% calc(100% - 18px), 
        calc(100% - 18px) 100%, 18px 100%, 
        0% calc(100% - 18px), 0% 72px, 
        10px 62px, 10px 42px, 
        0% 32px, 0% 18px
    );
    box-shadow: 
        0 0 25px rgba(255, 157, 0, 0.6), 
        inset 0 0 20px rgba(0, 162, 255, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
    position: relative;
    z-index: 20;
}

.center-event-monitor::before {
    content: "";
    position: absolute;
    top: -2px;
    width: 60%;
    height: 3px;
    background: #fff;
    box-shadow: 0 0 10px #ffbb45;
}

.center-event-monitor::after {
    content: "";
    position: absolute;
    bottom: -2px;
    width: 60%;
    height: 3px;
    background: #fff;
    box-shadow: 0 0 10px #ffbb45;
}

.center-live-action {
    font-size: 52px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(0, 210, 255, 0.8), 2px 2px 4px #000;
}

.center-chase-equation {
    position: absolute;
    left: 0;
    right: 0;
    top: 152px;
    text-align: center;
    font-size: 14px;
    font-weight: 900;
    color: #ffb43b;
    letter-spacing: 0.8px;
    text-shadow: 0 0 10px rgba(255, 180, 59, 0.7), 2px 2px 4px #000;
    white-space: nowrap;
    z-index: 15;
}

/* =========================================================
   TWO-TIER METALLIC BLUE STATS & TICKER BARS
========================================================= */
.stats-ribbon-upper {
    position: absolute;
    left: 0;
    top: 190px;
    width: 100%;
    height: 32px;
    background: linear-gradient(180deg, #0f243b 0%, #061424 100%);
    border-top: 1.5px solid #2d557f;
    border-bottom: 1.5px solid #00aaff;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 10;
}

.ribbon-cell {
    border-right: 1.5px solid #1c3c5f;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.8px;
}
.ribbon-cell:last-child {
    border-right: none;
}
.ribbon-label {
    color: #00d2ff;
}

.stats-ribbon-lower {
    position: absolute;
    left: 0;
    top: 222px;
    width: 100%;
    height: 36px;
    background: linear-gradient(180deg, #051322 0%, #01070e 100%);
    border-bottom: 2px solid #2d557f;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 16px;
    z-index: 10;
}

.over-column {
    display: flex;
    align-items: center;
    gap: 6px;
}

.over-title {
    font-size: 14px;
    font-weight: 900;
    color: #ff9d00;
    white-space: nowrap;
}

.balls-container {
    display: flex;
    align-items: center;
    gap: 5px;
}

.ball-circle {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #091c33;
    border: 1.5px solid #5784b1;
    color: #ffffff;
    font-size: 12px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ball-circle.four { background: #0275d8; border-color: #70baff; }
.ball-circle.six { background: #029432; border-color: #6cf598; }
.ball-circle.wicket { background: #d90429; border-color: #ff8a9a; }
.ball-circle.extra { background: #d97706; border-color: #fed7aa; }

.over-total {
    font-size: 14px;
    font-weight: 900;
    color: #ffffff;
    margin-left: 2px;
}

.over-divider-line {
    width: 1.5px;
    height: 22px;
    background: #2d557f;
    flex-shrink: 0;
}

.ticker-info-block {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}
.ticker-info-label {
    font-size: 14px;
    font-weight: 900;
    color: #ff9d00;
}
.ticker-info-val {
    font-size: 14px;
    font-weight: 900;
    color: #ffffff;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   BOTTOM PLAYER SECTION (2 BLUE + 1 COPPER CARD)
========================================================= */
.player-section {
    position: absolute;
    left: 0;
    bottom: 30px;
    width: 100%;
    height: 180px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 0 18px;
    z-index: 10;
}

.player-pod {
    position: relative;
    height: 145px;
    margin-top: 30px;
    border-radius: 12px;
    border: 2px solid #5784b1;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.85), 0 8px 25px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

/* Left & Middle Batter Pods = Cobalt Blue Gradient */
.player-pod.batter-pod {
    background: linear-gradient(180deg, #11416e 0%, #072340 50%, #031324 100%);
    border-color: #4f8ec9;
}

/* Right Bowler Pod = Metallic Copper Bronze */
.player-pod.bowler-pod {
    background: linear-gradient(180deg, #874911 0%, #522905 50%, #261100 100%);
    border-color: #cf7c2b;
}

/* Solid Tab Header on Top Right */
.player-tab-header {
    position: absolute;
    top: -24px;
    right: 20px;
    border-radius: 8px 8px 0 0;
    padding: 3px 22px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ffffff;
    box-shadow: 0 -3px 8px rgba(0,0,0,0.5);
}
.player-pod.batter-pod .player-tab-header {
    background: #0072ce;
    border: 1.5px solid #4f8ec9;
    border-bottom: none;
}
.player-pod.bowler-pod .player-tab-header {
    background: #d86c00;
    border: 1.5px solid #ff9d00;
    border-bottom: none;
}

/* Elevated Rounded Rectangular Portrait Frame with Glass Border */
.player-crest-wrap {
    position: absolute;
    top: -32px;
    left: 12px;
    width: 104px;
    height: 128px;
    border-radius: 12px;
    background: #02070f;
    border: 3.5px solid #a4c0db;
    box-shadow: 0 0 15px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.95);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
}
.player-pod.bowler-pod .player-crest-wrap {
    border-color: #df9e5e;
}
.player-crest-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

/* Main Metric Row */
.player-metrics-stack {
    margin-left: 126px;
    padding-right: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 85px;
}

.player-name-row {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 2px 2px 4px #000;
}

.player-score-row {
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 2px 2px 4px #000;
    display: flex;
    align-items: center;
}

.player-pod.bowler-pod .player-score-row {
    color: #ffb834;
}

.icon-badge {
    margin-left: 8px;
    display: inline-flex;
    align-items: center;
}

.bat-svg {
    width: 24px;
    height: 24px;
    transform: rotate(-30deg);
}

.ball-svg {
    width: 22px;
    height: 22px;
}

/* Sub-panel bottom footer on cards */
.player-sub-pill {
    width: 100%;
    height: 38px;
    background: #01060d;
    border-top: 1.5px solid #1c3c5f;
    border-radius: 0 0 10px 10px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    font-size: 13px;
    font-weight: 800;
    color: #8da4be;
}
.player-sub-pill .val {
    color: #ffffff;
    font-weight: 900;
}

/* =========================================================
   BOTTOM PROMO FOOTER
========================================================= */
.bottom-promo-footer {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 26px;
    background: linear-gradient(180deg, #091b2e 0%, #03080e 100%);
    border-top: 1.5px solid #2d557f;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
}

.bottom-promo-footer span {
    color: #ff9d00;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* =========================================================
   ANIMATIONS & OVERLAYS
========================================================= */
@keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.04); }
}

@keyframes scoreChange {
    0% { transform: scale(1); filter: brightness(1); }
    35% { transform: scale(1.2); filter: brightness(1.8); }
    100% { transform: scale(1); filter: brightness(1); }
}

@keyframes eventPop {
    0% { opacity: 0; transform: translate(-50%, 8px) scale(0.75); }
    10% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
    85% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -5px) scale(0.95); }
}

.live-badge {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 12px;
    border: 1.5px solid #00d2ff;
    border-radius: 16px;
    background: rgba(3, 14, 27, 0.95);
    color: #ffffff;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
}

.live-badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3030;
    animation: livePulse 1.25s infinite;
}

.score-change {
    animation: scoreChange 0.75s ease-out;
}

.match-status-flash {
    position: absolute;
    left: 50%;
    top: 310px;
    transform: translateX(-50%);
    z-index: 50;
    min-width: 250px;
    max-width: 600px;
    padding: 10px 24px;
    border: 2px solid #00d2ff;
    border-radius: 10px;
    background: rgba(3, 15, 29, 0.92);
    color: #fff;
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    display: none;
    white-space: nowrap;
}
.match-status-flash.show {
    display: block;
}

.event-flash {
    position: absolute;
    left: 50%;
    top: 310px;
    transform: translateX(-50%);
    z-index: 80;
    display: none;
    min-width: 240px;
    padding: 10px 26px;
    border: 3px solid #ff9d00;
    border-radius: 16px;
    background: rgba(2, 10, 20, 0.96);
    color: #ffffff;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1.8px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255, 157, 0, 0.5);
}
.event-flash.show {
    display: block;
    animation: eventPop 4.5s ease-in-out forwards;
}
.event-flash.four { border-color: #70baff; color: #dff2ff; }
.event-flash.six { border-color: #6cf598; color: #d9ffe8; }
.event-flash.wide { border-color: #00d9ff; color: #00d9ff; }
.event-flash.noball { border-color: #ff8a00; color: #ff8a00; }
.event-flash.wicket { border-color: #ff6b7d; color: #ffdbe0; }
</style>
</head>

<body>

<div class="screen-wrapper">

    <!-- FLOATING CONTROL BAR -->
    <div class="url-control-bar" id="urlControlBar">
        <span>CREX MATCH:</span>
        <input type="text" id="crexUrlInput" placeholder="Paste CREX URL or Match ID...">
        <button id="loadMatchUrlBtn">LOAD MATCH</button>
        <button id="generateObsBtn">COPY OBS URL</button>
        <span class="status-indicator" id="statusIndicator">Ready</span>
    </div>

    <!-- 1280x720 CANVAS BOARD -->
    <div class="scoreboard" id="scoreboardCanvas">
        
        <div class="stadium-overlay"></div>

        <div class="live-badge">
            <span class="live-badge-dot"></span>
            <span>LIVE</span>
        </div>

        <div id="eventFlash" class="event-flash"></div>
        <div id="matchStatusFlash" class="match-status-flash"></div>

        <!-- TOP BAR -->
        <div class="top-header-frame">

            <!-- LEFT TEAM CHEVRON -->
            <div class="team-deck left-side">
                <div class="team-crest-box">
                    <div class="team-logo-circle">
                        <img id="team1Logo" src="" alt="Team 1 Logo">
                    </div>
                </div>
                <div class="team-score-pod">
                    <div class="team-meta-stack">
                        <div class="team-badge-pill" id="team1BadgeBox">
                            <span id="team1BallIcon" class="badge-ball-icon" style="display: none;"></span>
                            <span id="team1Badge">AUS</span>
                        </div>
                        <div class="team-overs-pill" id="team1Overs">OVERS: 0.0</div>
                    </div>
                    <div class="team-big-score" id="team1Score">-</div>
                </div>
            </div>

            <!-- CENTER NOTCHED CYBER EVENT MONITOR -->
            <div class="center-event-monitor">
                <div id="centerLiveAction" class="center-live-action">•</div>
            </div>

            <!-- RIGHT TEAM CHEVRON -->
            <div class="team-deck right-side">
                <div class="team-score-pod">
                    <div class="team-big-score" id="team2Score">-</div>
                    <div class="team-meta-stack" style="text-align: right; align-items: flex-end;">
                        <div class="team-badge-pill" id="team2BadgeBox">
                            <span id="team2BallIcon" class="badge-ball-icon" style="display: none;"></span>
                            <span id="team2Badge">IND</span>
                        </div>
                        <div class="team-overs-pill" id="team2Overs">OVERS: 0.0</div>
                    </div>
                </div>
                <div class="team-crest-box">
                    <div class="team-logo-circle">

<script>
function fitScoreboardToWindow() {
    const el = document.getElementById("scoreboardCanvas");
    if (!el) return;

    const targetW = 1280;
    const targetH = 720;
    const winW = window.innerWidth || document.documentElement.clientWidth || 1280;
    const winH = window.innerHeight || document.documentElement.clientHeight || 720;

    if (winW <= 0 || winH <= 0) return;

    const scale = Math.min(winW / targetW, winH / targetH);
    const finalScale = (!isNaN(scale) && scale > 0.05) ? scale : 1;

    el.style.transformOrigin = "center center";
    el.style.transform = `scale(${finalScale})`;
}

window.addEventListener("resize", fitScoreboardToWindow);
window.addEventListener("orientationchange", fitScoreboardToWindow);
document.addEventListener("DOMContentLoaded", fitScoreboardToWindow);
fitScoreboardToWindow();

const API_BASE = "https://preet-sports.onrender.com";

const urlParams = new URLSearchParams(window.location.search);
const OBS_TOKEN = urlParams.get("token") || "";

function cleanCrexUrl(url) {
    if (!url) return "";
    let clean = url.trim().replace(/\.+$/, "");
    clean = clean.split("#")[0];
    clean = clean.split("?")[0];
    return clean.trim();
}

function normalizeInput(val) {
    if (!val) return "";
    let clean = cleanCrexUrl(val);
    if (!clean.startsWith("http") && clean.length <= 8) {
        clean = `https://crex.com/cricket-live-score/match-updates-${clean.toUpperCase()}`;
    }
    return clean;
}

let activeTargetUrl = localStorage.getItem("crex_match_input") || "";
const urlInput = document.getElementById("crexUrlInput");
const statusInd = document.getElementById("statusIndicator");
if (urlInput) urlInput.value = activeTargetUrl;

function flushDomElementsInstantly() {
    document.getElementById("team1Score").textContent = "-";
    document.getElementById("team2Score").textContent = "-";
    document.getElementById("team1Overs").textContent = "OVERS: 0.0";
    document.getElementById("team2Overs").textContent = "OVERS: 0.0";
    document.getElementById("centerLiveAction").textContent = "•";
    document.getElementById("centerChaseEquation").style.display = "none";
    document.getElementById("crr").textContent = "--";
    document.getElementById("rrr").textContent = "--";
    document.getElementById("partnership").textContent = "--";
    document.getElementById("target").textContent = "--";
    document.getElementById("player1Name").textContent = "Batter 1";
    document.getElementById("player1Score").textContent = "-";
    document.getElementById("b1Fours").textContent = "(0)";
    document.getElementById("b1Sixes").textContent = "(0)";
    document.getElementById("b1SR").textContent = "0.00";
    document.getElementById("b1BatIcon").style.display = "none";
    document.getElementById("player2Name").textContent = "Batter 2";
    document.getElementById("player2Score").textContent = "-";
    document.getElementById("b2Fours").textContent = "(0)";
    document.getElementById("b2Sixes").textContent = "(0)";
    document.getElementById("b2SR").textContent = "0.00";
    document.getElementById("b2BatIcon").style.display = "none";
    document.getElementById("bowlerName").textContent = "Bowler";
    document.getElementById("bowlerScore").textContent = "-";
    document.getElementById("bowlerEcon").textContent = "0.00";
}

function renderImageInCircle(elementId, imageUrl) {
    const el = document.getElementById(elementId);
    if (!el) return;
    if (imageUrl && typeof imageUrl === "string" && imageUrl.startsWith("http")) {
        let highResUrl = imageUrl.replace(/(\?|&)(w|width|h|height)=\d+/gi, "");
        el.src = highResUrl;
        el.style.display = "block";
        el.onerror = () => { el.style.display = "none"; };
    } else {
        el.style.display = "none";
    }
}

let fetchInProgress = false;
let retryTimer = null;
let lastSuccessfulData = null;
let lastSuccessfulTimestamp = 0;
let previousTeam1Score = null;
let previousTeam2Score = null;
let previousBallSignature = null;
let previousEventSignature = null;
let firstLiveRender = true;
let eventHideTimer = null;

const POLL_INTERVAL = 3000;
const REQUEST_TIMEOUT = 15000;

function renderOversTicker(recentOvers, lastWicket) {
    const ticker = document.getElementById("oversTicker");
    if (!ticker) return;
    ticker.innerHTML = "";

    const overs = Array.isArray(recentOvers) ? recentOvers.slice(-2) : [];
    const newestOverIndex = overs.length - 1;
    const newestOver = overs[newestOverIndex];
    const newestBallIndex = newestOver && Array.isArray(newestOver.balls) ? newestOver.balls.length - 1 : -1;

    const newestBallSignature = newestOver && newestBallIndex >= 0
        ? `${newestOver.label || ""}|${String(newestOver.balls[newestBallIndex]?.text ?? newestOver.balls[newestBallIndex] ?? "")}`
        : "";

    const isNewBall = Boolean(
        newestBallSignature &&
        newestBallSignature !== previousBallSignature &&
        !firstLiveRender
    );

    overs.forEach((o, overIndex) => {
        const col = document.createElement("div");
        col.className = "over-column";

        const title = document.createElement("span");
        title.className = "over-title";
        const overLabel = String(o && (o.label ?? o.over ?? "")).trim();
        title.textContent = overLabel || "Over";
        col.appendChild(title);

        const ballsBox = document.createElement("div");
        ballsBox.className = "balls-container";

        const balls = Array.isArray(o && o.balls) ? o.balls : [];

        balls.forEach((b) => {
            const ball = document.createElement("div");
            ball.className = "ball-circle";

            const ballText = String(b && typeof b === "object" ? (b.text ?? b.value ?? "") : (b ?? "")).trim();
            const ballType = String(b && typeof b === "object" ? (b.type ?? "") : "").trim().toLowerCase();

            ball.textContent = ballText || "•";

            if (ballType === "four" || ballText === "4") {
                ball.classList.add("four");
            } else if (ballType === "six" || ballText === "6") {
                ball.classList.add("six");
            } else if (
                ballType === "wicket" ||
                ballText.toUpperCase() === "W" ||
                (ballText.toLowerCase().includes("w") && !ballText.toLowerCase().includes("wd"))
            ) {
                ball.classList.add("wicket");
            } else if (
                ballType === "extra" ||
                ballType === "wide" ||
                ballType === "no-ball" ||
                ballText.toLowerCase().startsWith("wd") ||
                ballText.toLowerCase().startsWith("nb")
            ) {
                ball.classList.add("extra");
            }

            ballsBox.appendChild(ball);
        });

        col.appendChild(ballsBox);

        if (o && o.total !== undefined) {
            const total = document.createElement("span");
            total.className = "over-total";
            total.textContent = String(o.total).startsWith("=") ? String(o.total) : `= ${o.total}`;
            col.appendChild(total);
        }

        ticker.appendChild(col);
    });

    if (newestBallSignature) {
        previousBallSignature = newestBallSignature;
    }

    const sep = document.createElement("div");
    sep.className = "over-divider-line";
    ticker.appendChild(sep);

    const lwBlock = document.createElement("div");
    lwBlock.className = "ticker-info-block";
    const safeLastWicket = String(lastWicket || "-");
    lwBlock.innerHTML = `
        <span class="ticker-info-label">LAST WKT:</span>
        <span class="ticker-info-val" title="${safeLastWicket}">${safeLastWicket}</span>
    `;
    ticker.appendChild(lwBlock);
}

function cacheKeyForUrl(url) {
    return "preet_sports_last_score_" + btoa(encodeURIComponent(url || "default")).replace(/[^a-zA-Z0-9_-]/g, "_");
}

function saveLastSuccessfulData(data) {
    try {
        lastSuccessfulData = data;
        lastSuccessfulTimestamp = Date.now();
        const key = cacheKeyForUrl(activeTargetUrl);
        localStorage.setItem(key, JSON.stringify({
            timestamp: lastSuccessfulTimestamp,
            data: data
        }));
    } catch (e) {}
}

function restoreLastSuccessfulData() {
    try {
        const key = cacheKeyForUrl(activeTargetUrl);
        const raw = localStorage.getItem(key);
        if (!raw) return false;

        const cached = JSON.parse(raw);
        if (!cached || !cached.data || cached.data.success === false) return false;

        lastSuccessfulData = cached.data;
        lastSuccessfulTimestamp = Number(cached.timestamp || 0);

        renderScoreData(lastSuccessfulData, true);
        return true;
    } catch (e) {
        return false;
    }
}

function scheduleNextFetch(delay = POLL_INTERVAL) {
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(() => {
        retryTimer = null;
        fetchScores();
    }, delay);
}

function setConnectionStatus(text, color) {
    if (!statusInd) return;
    statusInd.textContent = text;
    statusInd.style.color = color;
    statusInd.title = text;
}

function animateElementByClass(id, className) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove(className);
    void el.offsetWidth;
    el.classList.add(className);
    setTimeout(() => el.classList.remove(className), 900);
}

function scoreRuns(score) {
    const m = String(score || "").match(/^\s*(\d+)/);
    return m ? Number(m[1]) : null;
}

function showMatchStatus(statusText) {
    const el = document.getElementById("matchStatusFlash");
    if (!el) return;
    const text = String(statusText || "").trim();

    if (!text) {
        el.textContent = "";
        el.classList.remove("show");
        return;
    }

    el.textContent = text;
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
}

function showEventFlash(label, type) {
    const el = document.getElementById("eventFlash");
    if (!el || !label) return;

    if (eventHideTimer) {
        clearTimeout(eventHideTimer);
        eventHideTimer = null;
    }

    el.className = "event-flash";
    el.textContent = label;
    if (type) el.classList.add(type);

    void el.offsetWidth;
    el.classList.add("show");

    eventHideTimer = setTimeout(() => {
        el.classList.remove("show");
        eventHideTimer = null;
    }, 4500);
}

function renderScoreData(data, fromCache = false) {
    if (!data || data.success === false) {
        throw new Error("Invalid score data");
    }

    const liveStatusText = String(data.status ?? data.match_status ?? data.live_status ?? "").trim();
    const normalizedStatus = liveStatusText.toLowerCase();

    if (
        normalizedStatus.includes("innings break") ||
        normalizedStatus.includes("match end") ||
        normalizedStatus.includes("match ended") ||
        normalizedStatus.includes("stumps") ||
        normalizedStatus.includes("rain") ||
        normalizedStatus.includes("delay") ||
        normalizedStatus.includes("abandoned") ||
        normalizedStatus.includes("tea") ||
        normalizedStatus.includes("lunch")
    ) {
        showMatchStatus(liveStatusText);
    } else {
        showMatchStatus("");
    }

    const apiTeam1 = (data.team1 && typeof data.team1 === "object") ? data.team1 : {};
    const apiTeam2 = (data.team2 && typeof data.team2 === "object") ? data.team2 : {};

    const t1Name = String(apiTeam1.full_name || apiTeam1.short || (typeof data.team1 === "string" ? data.team1 : "") || "TEAM 1").toUpperCase();
    let t2Name = String(apiTeam2.full_name || apiTeam2.short || (typeof data.team2 === "string" ? data.team2 : "") || "TEAM 2").toUpperCase();

    const abbreviation = (name) => {
        const n = String(name || "").toUpperCase();
        if (n.includes("AUSTRALIA") || n.includes("AUSCH")) return "AUS";
        if (n.includes("INDIA") || n.includes("INDCH")) return "IND";
        if (n.includes("SOUTH AFRICA")) return "SA";
        if (n.includes("ENGLAND")) return "ENG";
        if (n.includes("SRI LANKA")) return "SL";
        if (n.includes("NEW ZEALAND")) return "NZ";
        if (n.includes("PAKISTAN")) return "PAK";
        if (n.includes("WEST INDIES")) return "WI";
        if (n.includes("ZIMBABWE")) return "ZIM";
        return n.length <= 8 ? n : n.split(/\s+/).map(x => x[0]).join("").slice(0, 4);
    };

    const t1Badge = abbreviation(t1Name);
    const t2Badge = abbreviation(t2Name);

    const equationText = String(data.equation || data.status || "").trim();
    const australiaBowling = /AUS\s+opt\s+to\s+Bowl/i.test(equationText);

    let t1Score = apiTeam1.score ? String(apiTeam1.score).replace("/", "-") : "0-0";
    let t1Overs = apiTeam1.overs ? String(apiTeam1.overs).replace(/[()]/g, "") : "0.0";
    let t2Score = apiTeam2.score ? String(apiTeam2.score).replace("/", "-") : "0-0";
    let t2Overs = apiTeam2.overs ? String(apiTeam2.overs).replace(/[()]/g, "") : "0.0";

    if (!fromCache && !firstLiveRender) {
        const old1 = scoreRuns(previousTeam1Score);
        const old2 = scoreRuns(previousTeam2Score);
        const new1 = scoreRuns(t1Score);
        const new2 = scoreRuns(t2Score);

        if (old1 !== null && new1 !== null && old1 !== new1) animateElementByClass("team1Score", "score-change");
        if (old2 !== null && new2 !== null && old2 !== new2) animateElementByClass("team2Score", "score-change");
    }

    let t1Role = "BOWLING";
    let t2Role = "BATTING";

    if (australiaBowling) {
        t1Role = "BATTING";
        t2Role = "BOWLING";
        if (t2Score === t1Score) {
            t2Score = "Yet to bat";
            t2Overs = "Yet to bat";
        }
    } else if (/SA\s+opt\s+to\s+Bowl/i.test(equationText)) {
        t1Role = "BOWLING";
        t2Role = "BATTING";
        if (t1Score === t2Score) {
            t1Score = "Yet to bat";
            t1Overs = "Yet to bat";
        }
    }

    renderImageInCircle("team1Logo", apiTeam1.logo || data.team1Logo);
    renderImageInCircle("team2Logo", apiTeam2.logo || data.team2Logo);

    document.getElementById("team1Badge").textContent = t1Badge;
    document.getElementById("team1Score").textContent = t1Score;
    document.getElementById("team1Overs").textContent = `OVERS: ${t1Overs}`;
    document.getElementById("team1BallIcon").style.display = (t1Role === "BOWLING") ? "inline-block" : "none";

    document.getElementById("team2Badge").textContent = t2Badge;
    document.getElementById("team2Score").textContent = t2Score;
    document.getElementById("team2Overs").textContent = `OVERS: ${t2Overs}`;
    document.getElementById("team2BallIcon").style.display = (t2Role === "BOWLING") ? "inline-block" : "none";

    const actionEl = document.getElementById("centerLiveAction");
    const latestBallObject = Array.isArray(data.current_over?.balls) && data.current_over.balls.length
        ? data.current_over.balls[data.current_over.balls.length - 1]
        : null;

    const ballText = String(latestBallObject && typeof latestBallObject === "object" ? (latestBallObject.text ?? "") : (latestBallObject ?? data.last_ball ?? data.liveBall ?? "")).trim();
    const ballType = String(latestBallObject && typeof latestBallObject === "object" ? (latestBallObject.type ?? "") : "").trim();

    const currentOverLabel = String(data.current_over?.label || "");
    const eventSignature = [currentOverLabel, ballText, ballType, String(t1Score), String(t2Score)].join("|");

    let eventLabel = "";
    let eventType = "";
    const normalizedBallText = ballText.toLowerCase().replace(/[\s-]/g, "");
    const normalizedBallType = ballType.toLowerCase().replace(/[\s-]/g, "");

    if (!fromCache && !firstLiveRender && eventSignature !== previousEventSignature) {
        if (normalizedBallType === "four" || normalizedBallText === "4") {
            eventLabel = "FOUR!";
            eventType = "four";
        } else if (normalizedBallType === "six" || normalizedBallText === "6") {
            eventLabel = "SIX!";
            eventType = "six";
        } else if (
            normalizedBallType === "wicket" ||
            normalizedBallText === "w" ||
            normalizedBallText === "1w" ||
            /wicket/i.test(String(data.last_event || data.live_event || ""))
        ) {
            eventLabel = "WICKET!";
            eventType = "wicket";
        } else if (
            normalizedBallText === "wd" ||
            normalizedBallText.startsWith("wd") ||
            normalizedBallType === "wide" ||
            normalizedBallType === "wideball"
        ) {
            eventLabel = "WIDE!";
            eventType = "wide";
        } else if (
            normalizedBallText === "nb" ||
            normalizedBallText.endsWith("nb") ||
            normalizedBallType === "noball" ||
            normalizedBallType === "no-ball"
        ) {
            eventLabel = "NO BALL!";
            eventType = "noball";
        }
    }

    if (eventLabel) {
        showEventFlash(eventLabel, eventType);
    }

    previousEventSignature = eventSignature;

    let actionText = ballText || data.last_event || data.live_event || "•";
    actionText = String(actionText).trim();

    const eventUpper = actionText.toUpperCase();
    if (eventUpper.includes("RUN OUT")) actionText = "RUN OUT";
    else if (eventUpper === "WICKET") actionText = "W";
    else if (eventUpper === "WIDE") actionText = "WD";
    else if (eventUpper === "NO BALL" || eventUpper === "NO-BALL") actionText = "NB";
    else if (eventUpper === "FOUR") actionText = "4";
    else if (eventUpper === "SIX") actionText = "6";
    else if (actionText.length > 8) actionText = ballText || "•";

    actionEl.textContent = actionText || "•";
    if (actionText === "RUN OUT") {
        actionEl.style.fontSize = "30px";
    } else if (String(actionText).length <= 2) {
        actionEl.style.fontSize = "52px";
    } else {
        actionEl.style.fontSize = "36px";
    }

    const chaseEl = document.getElementById("centerChaseEquation");
    chaseEl.textContent = equationText || "";
    chaseEl.style.display = equationText ? "block" : "none";

    const recentOvers = Array.isArray(data.structured_overs) ? data.structured_overs : (data.recentOvers || []);
    renderOversTicker(recentOvers, data.last_wicket);

    document.getElementById("crr").textContent = data.crr ?? "--";
    document.getElementById("rrr").textContent = data.rrr ?? "--";
    document.getElementById("partnership").textContent = data.partnership || "--";
    document.getElementById("target").textContent = (data.target && data.target !== "") ? data.target : "--";

    const b1 = data.batsman1 || data.batter1;
    const b2 = data.batsman2 || data.batter2;

    if (b1) {
        document.getElementById("player1Name").textContent = b1.short_name || b1.name || "Batter 1";
        document.getElementById("player1Score").textContent = `${b1.runs ?? 0} (${b1.balls ?? 0})`;
        document.getElementById("b1Fours").textContent = `(${b1.fours ?? 0})`;
        document.getElementById("b1Sixes").textContent = `(${b1.sixes ?? 0})`;
        document.getElementById("b1SR").textContent = b1.sr ?? "0.00";
        document.getElementById("b1BatIcon").style.display = b1.on_strike ? "inline-flex" : "none";
        renderImageInCircle("player1Image", b1.img || b1.image);
    }

    if (b2) {
        document.getElementById("player2Name").textContent = b2.short_name || b2.name || "Batter 2";
        document.getElementById("player2Score").textContent = `${b2.runs ?? 0} (${b2.balls ?? 0})`;
        document.getElementById("b2Fours").textContent = `(${b2.fours ?? 0})`;
        document.getElementById("b2Sixes").textContent = `(${b2.sixes ?? 0})`;
        document.getElementById("b2SR").textContent = b2.sr ?? "0.00";
        document.getElementById("b2BatIcon").style.display = b2.on_strike ? "inline-flex" : "none";
        renderImageInCircle("player2Image", b2.img || b2.image);
    }

    if (data.bowler) {
        const bowler = data.bowler;
        document.getElementById("bowlerName").textContent = bowler.short_name || bowler.name || "Bowler";
        document.getElementById("bowlerScore").textContent = bowler.figures || "-";
        document.getElementById("bowlerEcon").textContent = bowler.econ || "0.00";
        renderImageInCircle("bowlerImage", bowler.img || bowler.image);
    }

    if (!fromCache) {
        previousTeam1Score = t1Score;
        previousTeam2Score = t2Score;
        firstLiveRender = false;
    }

    if (fromCache) {
        setConnectionStatus("Cached • Reconnecting...", "#ff9d00");
    }
}

async function fetchScores() {
    if (fetchInProgress) return;

    fetchInProgress = true;
    setConnectionStatus("SYNCING LIVE DATA...", "#00d2ff");

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

    try {
        let fetchEndpoint = "";
        if (OBS_TOKEN) {
            fetchEndpoint = `${API_BASE}/api/obs/${encodeURIComponent(OBS_TOKEN)}/scrape?t=${Date.now()}`;
        } else if (activeTargetUrl) {
            fetchEndpoint = `${API_BASE}/api/scrape?url=${encodeURIComponent(activeTargetUrl)}&t=${Date.now()}`;
        } else {
            setConnectionStatus("AWAITING URL", "#ff9d00");
            return;
        }

        const res = await fetch(fetchEndpoint, {
            method: "GET",
            cache: "no-store",
            mode: "cors",
            signal: controller.signal,
            headers: {
                "Accept": "application/json",
                "Cache-Control": "no-cache"
            }
        });

        const rawText = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${rawText.slice(0, 100)}`);

        let data;
        try {
            data = JSON.parse(rawText);
        } catch (e) {
            throw new Error(`API non-JSON: ${rawText.slice(0, 100)}`);
        }

        if (!data || data.success !== true) {
            throw new Error(data?.error || "Invalid response");
        }

        renderScoreData(data, false);
        saveLastSuccessfulData(data);
        setConnectionStatus("LIVE • SYNCED", "#6cf598");

    } catch (err) {
        const msg = err?.message || "Network error";
        if (err?.name === "AbortError") {
            setConnectionStatus("RETRYING • TIMEOUT", "#ff9d00");
        } else {
            setConnectionStatus("RETRYING...", "#ff9d00");
        }
    } finally {
        clearTimeout(timeoutId);
        fetchInProgress = false;
        scheduleNextFetch(POLL_INTERVAL);
    }
}

async function triggerMatchLoad() {
    let rawVal = urlInput.value.trim();
    if (!rawVal) {
        alert("Please enter a valid CREX URL or Match ID");
        return;
    }

    const target = normalizeInput(rawVal);
    activeTargetUrl = target;
    localStorage.setItem("crex_match_input", target);
    urlInput.value = target;

    if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
    }

    flushDomElementsInstantly();
    restoreLastSuccessfulData();
    setConnectionStatus("CONNECTING...", "#00d2ff");

    try {
        await fetch(`${API_BASE}/api/default-url`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: target })
        });
    } catch (e) {}

    fetchScores();
}

document.getElementById("loadMatchUrlBtn").addEventListener("click", triggerMatchLoad);

document.getElementById("generateObsBtn").addEventListener("click", async () => {
    const crexUrl = normalizeInput(urlInput.value.trim());
    if (!crexUrl) {
        alert("Please paste a valid CREX match URL first.");
        return;
    }

    try {
        setConnectionStatus("GENERATING OBS LINK...", "#00d2ff");

        const response = await fetch(`${API_BASE}/api/obs-token`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ url: crexUrl })
        });

        const data = await response.json();
        if (!response.ok || !data.success || !data.token) {
            throw new Error(data.error || "Unable to generate OBS URL");
        }

        const obsUrl = `${window.location.origin}${window.location.pathname}?token=${encodeURIComponent(data.token)}&hide=1`;

        try {
            await navigator.clipboard.writeText(obsUrl);
        } catch (clipboardError) {
            const temp = document.createElement("textarea");
            temp.value = obsUrl;
            temp.style.position = "fixed";
            temp.style.left = "-9999px";
            document.body.appendChild(temp);
            temp.focus();
            temp.select();
            document.execCommand("copy");
            temp.remove();
        }

        setConnectionStatus("OBS URL COPIED ✓", "#6cf598");
        alert("OBS Browser Source URL copied to clipboard:\n\n" + obsUrl);

    } catch (error) {
        setConnectionStatus("OBS LINK ERROR", "#ff6b6b");
        alert("Could not generate OBS URL: " + (error.message || "Unknown error"));
    }
});

urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") triggerMatchLoad();
});

if (urlParams.get("hide") === "1") {
    document.getElementById("urlControlBar").style.display = "none";
}

window.addEventListener("load", () => {
    const restored = restoreLastSuccessfulData();
    if (restored) {
        setConnectionStatus("Cached • Connecting...", "#00d2ff");
    } else {
        setConnectionStatus("Ready", "#00d2ff");
    }
    if (activeTargetUrl || OBS_TOKEN) {
        fetchScores();
    }
});
</script>
