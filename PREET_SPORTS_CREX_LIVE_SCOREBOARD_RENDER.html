<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>PREET SPORTS | Professional Cricket Live Scoreboard</title>

<!-- ULTRA-HD BROADCAST TYPOGRAPHY -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Rajdhani:wght@600;700;800;900&family=Teko:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    font-family: 'Montserrat', 'Rajdhani', sans-serif;
}

.screen-wrapper {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: #000000;
}

/* FLOATING URL CONTROL BAR (Press 'H' or add ?hide=1 in OBS) */
.url-control-bar {
    position: absolute;
    top: 8px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(4, 13, 26, 0.98);
    border: 2px solid #FFB800;
    border-radius: 30px;
    padding: 5px 14px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.95);
    width: 90%;
    max-width: 920px;
}
.url-control-bar.hidden-obs {
    display: none !important;
}
.url-control-bar span {
    color: #FFB800;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
}
.url-control-bar input {
    flex: 1;
    background: #030d1c;
    border: 1.5px solid #00f0ff;
    border-radius: 18px;
    color: #ffffff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 5px 12px;
    outline: none;
}
.url-control-bar button {
    background: linear-gradient(180deg, #FFB800, #d97706);
    border: none;
    border-radius: 18px;
    color: #040D1A;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.8px;
    padding: 5px 14px;
    cursor: pointer;
    white-space: nowrap;
}
.url-control-bar button:active {
    transform: scale(0.96);
}
.status-indicator {
    font-size: 13px;
    font-weight: 800;
    color: #6cf598;
    white-space: nowrap;
}

/* =========================================================
   1280 x 720 CANVAS - COMPLETE BROADCAST TELECAST
========================================================= */
.scoreboard {
    position: relative;
    width: 1280px;
    height: 720px;
    min-width: 1280px;
    min-height: 720px;
    background: #040D1A;
    transform-origin: center center;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 0 50px rgba(0,0,0,0.95);
}

/* LUSH DAYLIGHT CRICKET STADIUM */
.stadium-background {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 380px;
    pointer-events: none;
    background: 
        linear-gradient(180deg, rgba(3, 8, 17, 0.15) 0%, rgba(3, 8, 17, 0) 50%, rgba(4, 13, 26, 0.95) 100%),
        url("https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=1400&q=90") center 32%/cover no-repeat;
    opacity: 1;
    z-index: 1;
}

/* =========================================================
   TOP BRANDING HEADER
========================================================= */
.top-brand-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
}

.brand-capsule {
    background: linear-gradient(180deg, #091f3b 0%, #030d1a 100%);
    border: 2px solid #336699;
    border-radius: 8px;
    padding: 5px 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.2);
}
.brand-capsule .brand-white {
    font-size: 28px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
}
.brand-capsule .brand-gold {
    font-size: 28px;
    font-weight: 900;
    color: #FFB800;
    letter-spacing: 2px;
}

.live-badge {
    background: linear-gradient(180deg, #ff1a2b 0%, #c40010 100%);
    border: 1.5px solid #ff6675;
    border-radius: 8px;
    padding: 2px 24px;
    color: #ffffff;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-top: 4px;
    box-shadow: 0 4px 15px rgba(255, 26, 43, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    text-shadow: 1px 1px 3px #000;
}

/* =========================================================
   MATCH FIXTURE CHEVRONS (IND vs WI)
========================================================= */
.match-fixture-bar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 6px;
    padding: 0 20px;
}

.fixture-pod {
    display: flex;
    align-items: center;
    height: 96px;
    flex: 1;
    position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,0.85);
}

.fixture-pod.left-side {
    background: linear-gradient(90deg, #021a3a 0%, #0052b4 40%, #003373 100%);
    border: 2.5px solid #00d2ff;
    border-radius: 16px 0 0 16px;
    padding-left: 18px;
    padding-right: 22px;
    justify-content: space-between;
}

.fixture-pod.right-side {
    background: linear-gradient(270deg, #3d0213 0%, #8b0029 40%, #520018 100%);
    border: 2.5px solid #ff3b69;
    border-radius: 0 16px 16px 0;
    padding-right: 18px;
    padding-left: 22px;
    justify-content: space-between;
}

.crest-shield {
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
    flex-shrink: 0;
}
.crest-shield img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.team-name-hero {
    font-family: 'Montserrat', sans-serif;
    font-size: 58px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    text-shadow: 2px 2px 6px #000;
}

/* 3D GOLD VS CENTER PIECE */
.center-vs-trap {
    width: 148px;
    height: 98px;
    background: linear-gradient(180deg, #2b1f06 0%, #150f02 100%);
    border-top: 2.5px solid #FFB800;
    border-bottom: 2.5px solid #FFB800;
    position: relative;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: polygon(14% 0%, 86% 0%, 100% 100%, 0% 100%);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
}

.vs-text-gold {
    font-size: 44px;
    font-weight: 900;
    font-style: italic;
    color: #ffd700;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.7), 2px 2px 4px #000;
}

.sub-fixture-pill {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: #020814;
    border: 1.5px solid #00d2ff;
    border-radius: 8px;
    padding: 2px 22px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1.5px;
    white-space: nowrap;
    z-index: 20;
    box-shadow: 0 4px 10px rgba(0,0,0,0.8);
}

/* =========================================================
   MIDDLE SCORE & CURRENT OVER SECTION
========================================================= */
.live-score-row {
    position: relative;
    z-index: 10;
    display: flex;
    gap: 14px;
    width: 100%;
    padding: 0 20px;
    margin-top: 20px;
}

/* BIG MAIN SCORE CARD (LEFT) */
.score-card-main {
    flex: 1.15;
    height: 92px;
    background: linear-gradient(180deg, #09264f 0%, #031429 100%);
    border: 2px solid #00a8ff;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-right: 26px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.9), inset 0 0 15px rgba(0, 168, 255, 0.2);
}

.score-team-tag {
    background: #ffffff;
    height: 100%;
    width: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: #052654;
    clip-path: polygon(0% 0%, 82% 0%, 100% 100%, 0% 100%);
    letter-spacing: 1px;
}

.score-digits-hero {
    font-family: 'Montserrat', sans-serif;
    font-size: 68px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    line-height: 1;
    text-shadow: 3px 3px 6px #000;
}

.overs-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.overs-num {
    font-family: 'Montserrat', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    text-shadow: 2px 2px 4px #000;
}
.overs-text {
    font-size: 15px;
    font-weight: 900;
    color: #9cb3ce;
    letter-spacing: 1px;
    margin-top: 2px;
}

/* CURRENT OVER BALL PILLS CARD (RIGHT) */
.current-over-card {
    flex: 0.95;
    height: 92px;
    background: #06182e;
    border: 2px solid #FFB800;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 25px rgba(0,0,0,0.9);
}

.over-card-header {
    background: linear-gradient(90deg, #FFB800 0%, #e6a100 100%);
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #030811;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.over-card-balls {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 8px;
    background: #04101e;
}

.ball-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #0d2c54;
    border: 2px solid #205994;
    color: #ffffff;
    font-size: 24px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 1px 1px 2px #000;
}
.ball-circle.four { background: #FFB800; border-color: #ffd000; color: #04101e; }
.ball-circle.six { background: #FFB800; border-color: #ffd000; color: #04101e; }
.ball-circle.wicket { background: #d90429; border-color: #ff6b81; color: #fff; }
.ball-circle.extra { background: #00a8ff; border-color: #70cfff; color: #fff; }
.ball-circle.dot { color: #889fb8; }

/* =========================================================
   REQUESTED SECTION: TARGET, PARTNERSHIP, RRR, LAST WICKET
========================================================= */
.match-stats-bar {
    position: relative;
    z-index: 10;
    width: calc(100% - 40px);
    margin: 10px 20px 0 20px;
    height: 44px;
    background: linear-gradient(90deg, #020b18 0%, #061933 50%, #020b18 100%);
    border: 1.5px solid #FFB800;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.85);
}

.stat-metric {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 21px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.8px;
    white-space: nowrap;
}
.stat-metric .lbl {
    color: #00f0ff;
    font-weight: 900;
}
.stat-metric .val {
    color: #FFB800;
    font-weight: 900;
}
.stat-metric.last-wkt-metric {
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.stat-metric.last-wkt-metric .val {
    color: #ff4d6d;
}

.stat-divider {
    width: 1.5px;
    height: 24px;
    background: #1f3f66;
}

/* =========================================================
   TABLE DETAIL SECTION (BATTERS & BOWLER SIDE BY SIDE)
========================================================= */
.tables-row {
    position: relative;
    z-index: 10;
    display: flex;
    gap: 14px;
    width: 100%;
    padding: 0 20px;
    margin-top: 10px;
}

/* BATTER TABLE */
.batters-panel {
    flex: 1.15;
    background: linear-gradient(180deg, #081d36 0%, #030d19 100%);
    border: 2px solid #0077cc;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.85);
}

.table-header-blue {
    background: linear-gradient(90deg, #005bb5 0%, #004080 100%);
    height: 30px;
    display: grid;
    grid-template-columns: 2.2fr 0.8fr 0.8fr 0.8fr 0.8fr 1fr;
    align-items: center;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1.2px;
}

.table-row-item {
    height: 36px;
    display: grid;
    grid-template-columns: 2.2fr 0.8fr 0.8fr 0.8fr 0.8fr 1fr;
    align-items: center;
    padding: 0 14px;
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}
.table-row-item:last-child {
    border-bottom: none;
}
.table-row-item .striker-highlight {
    color: #FFB800;
    font-weight: 900;
}
.table-row-item .col-name {
    font-weight: 900;
    letter-spacing: 0.5px;
}

/* BOWLER TABLE */
.bowler-panel {
    flex: 0.95;
    background: linear-gradient(180deg, #2a050f 0%, #120106 100%);
    border: 2px solid #d90429;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.85);
}

.table-header-red {
    background: linear-gradient(90deg, #c40026 0%, #850019 100%);
    height: 30px;
    display: grid;
    grid-template-columns: 2.2fr 0.8fr 0.8fr 0.8fr 0.8fr 1fr;
    align-items: center;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1.2px;
}

/* =========================================================
   BOTTOM RIBBON (CRR, CHASE / TOSS, PROJECTED)
========================================================= */
.bottom-meta-ribbon {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 42px;
    background: #02070f;
    border-top: 2px solid #1a3c66;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    margin-top: auto;
}

.ribbon-pill-left {
    background: #0a264a;
    border: 1.5px solid #00a8ff;
    border-radius: 20px;
    padding: 3px 16px;
    color: #ffffff;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
}
.ribbon-pill-left .num {
    color: #FFB800;
    margin-left: 6px;
}

.ribbon-proj-center {
    font-size: 19px;
    font-weight: 900;
    color: #00d2ff;
    letter-spacing: 1.5px;
}
.ribbon-proj-center .proj-score {
    color: #ffffff;
    font-size: 22px;
    margin-left: 6px;
}

.ribbon-toss-right {
    font-size: 17px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}
</style>

function abbreviation(name) {
    const n = String(name || "").trim().toUpperCase();
    if (!n) return "-";
    if (n.includes("WEST INDIES") || n.includes("WIN") || n === "WI") return "WI";
    if (n.includes("INDIA") || n.includes("INDCH") || n === "IND") return "IND";
    if (n.includes("PAKISTAN") || n === "PAK") return "PAK";
    if (n.includes("AUSTRALIA") || n === "AUS") return "AUS";
    if (n.includes("SOUTH AFRICA") || n === "SA") return "SA";
    if (n.includes("ENGLAND") || n === "ENG") return "ENG";
    if (n.includes("SRI LANKA") || n === "SL") return "SL";
    if (n.includes("NEW ZEALAND") || n === "NZ") return "NZ";
    if (n.includes("BANGLADESH") || n === "BAN") return "BAN";
    if (n.includes("AFGHANISTAN") || n === "AFG") return "AFG";
    return n.length <= 6 ? n : n.split(/\s+/).map(x => x[0]).join("").slice(0, 4);
}

function extractTeamsFromCrexUrl(url) {
    if (!url) return null;
    const clean = String(url).split(/[?#]/)[0];
    const pathSlug = clean.split("/").filter(Boolean).pop() || "";
    const separator = pathSlug.toLowerCase().indexOf("-vs-");
    if (separator < 0) return null;

    const leftSlug = pathSlug.slice(0, separator);
    let rightSlug = pathSlug.slice(separator + 4);
    // CREX slugs usually put the match number and format after the second team.
    const ordinal = rightSlug.match(/-\d+(?:st|nd|rd|th)-/i);
    if (ordinal) rightSlug = rightSlug.slice(0, ordinal.index);
    else rightSlug = rightSlug.split(/-match-updates/i)[0];

    const teamA = abbreviation(leftSlug.replace(/-/g, " "));
    const teamB = abbreviation(rightSlug.replace(/-/g, " "));
    if (!teamA || !teamB) return null;
    return { teamA, teamB };
}
function cleanCrexUrl(url) {
    if (!url) return "";
    let clean = url.trim().replace(/\.+$/, "");
    clean = clean.split("#")[0];
    clean = clean.split("?")[0];
    return clean.trim();
}

const DEFAULT_MATCH_URL = "https://crex.com/cricket-live-score/ind-vs-wi-4th-t20i-west-indies-tour-of-india-2026-match-updates-11A0";

function normalizeInput(val) {
    if (!val) return DEFAULT_MATCH_URL;
    let clean = cleanCrexUrl(val).trim();
    if (clean.includes("ind-vs-wi") && !clean.match(/-[0-9a-zA-Z]{3,5}$/)) {
        clean = DEFAULT_MATCH_URL;
    } else if (!clean.startsWith("http") && clean.length <= 8) {
        clean = `https://crex.com/cricket-live-score/match-updates-${clean.toUpperCase()}`;
    }
    return clean;
}

    }
    const slug = cleanCrexUrl(url).toLowerCase();
    const subtitle = document.getElementById("matchSubTitle");
    if (subtitle) {
        const numberedFormat = slug.match(/-(\d+(?:st|nd|rd|th))-(t\d{1,2}i?|odi|test)(?:-|$)/i);
        const numberedRound = slug.match(/-(\d+(?:st|nd|rd|th))-(semi-final|quarter-final|qualifier|eliminator|final)(?:-(t\d{1,2}i?|odi|test))?(?:-|$)/i);
        if (numberedFormat) subtitle.textContent = `${numberedFormat[1]} ${numberedFormat[2].toUpperCase()}`;
        else if (numberedRound) subtitle.textContent = `${numberedRound[1]} ${numberedRound[2].replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase())}${numberedRound[3] ? " " + numberedRound[3].toUpperCase() : ""}`;
        else if (/test/.test(slug)) subtitle.textContent = "TEST MATCH";
        else subtitle.textContent = "LIVE MATCH";
    }
}

function renderCurrentOverBalls(balls) {
    const container = document.getElementById("currentOverBallsContainer");
    if (!container) return;
    container.innerHTML = "";

    const ballArray = Array.isArray(balls) ? balls.slice(-6) : [];
    for (let i = 0; i < 6; i++) {
        const raw = ballArray[i];
        const div = document.createElement("div");
        div.className = "ball-circle";

        if (raw !== undefined && raw !== null) {
            const original = String(typeof raw === "object" ? (raw.text ?? raw.value ?? raw.label ?? "") : raw).trim();
            const compact = original.replace(/\s+/g, "").replace(/[()]/g, "");
            const low = compact.toLowerCase();
            const isWicket = /^(w|wk|out|wicket)$/.test(low) || low.includes("wicket");
            const isWide = low.includes("wd") || low.includes("wide");
            const isNoBall = low.includes("nb") || low.includes("no-ball") || low.includes("noball");
            const numericPrefix = (compact.match(/^\d+/) || [""])[0];

            let display = compact || "•";
            if (isWide || isNoBall) {
                const suffix = isWide ? "WD" : "NB";
                display = numericPrefix ? `${numericPrefix}${suffix}` : suffix;
                div.classList.add("extra");
                div.title = isWide ? `Wide: ${original}` : `No-ball: ${original}`;
            } else if (isWicket) {
                display = "W";
                div.classList.add("wicket");
                div.title = `Wicket: ${original}`;
            } else if (/^4(?:\D|$)/.test(compact) || compact === "4") {
                display = "4";
                div.classList.add("four");
            } else if (/^6(?:\D|$)/.test(compact) || compact === "6") {
                display = "6";
                div.classList.add("six");
            } else if (/^(\.|0|dot|•)$/.test(low)) {
                display = "•";
                div.classList.add("dot");
            }

            div.textContent = display;
            if (display.length > 2) div.classList.add("ball-label-long");
            if (i === Math.min(ballArray.length - 1, 5)) div.classList.add("latest");
        } else {
            div.textContent = "–";
            div.classList.add("dot", "empty-ball");
            div.setAttribute("aria-hidden", "true");
        }
        container.appendChild(div);
    }
}

    if (!data || data.success === false) return;

    lastSuccessfulTimestamp = Date.now();

    const apiTeam1 = (data.team1 && typeof data.team1 === "object") ? data.team1 : {};
    const apiTeam2 = (data.team2 && typeof data.team2 === "object") ? data.team2 : {};

    const t1Name = String(apiTeam1.short || apiTeam1.full_name || "IND").toUpperCase();
    const t2Name = String(apiTeam2.short || apiTeam2.full_name || "WI").toUpperCase();

    const t1Short = abbreviation(t1Name);

    document.getElementById("team1HeroName").textContent = t1Short;
    document.getElementById("team2HeroName").textContent = t2Short;
    if (CDN_FLAGS[t1Short]) document.getElementById("team1HeroCrest").src = CDN_FLAGS[t1Short];
    if (CDN_FLAGS[t2Short]) document.getElementById("team2HeroCrest").src = CDN_FLAGS[t2Short];

    // Determine Batting Team Score
    let battingScore = apiTeam1.score ? String(apiTeam1.score) : "0/0";
    let battingOvers = apiTeam1.overs ? String(apiTeam1.overs).replace(/[()]/g, "") : "0.0";
    let battingTeam = t1Short;

    const statusUpper = String(data.equation || data.status || "").toUpperCase();
    const combinedMatchStatus = `${data.status || ""} ${data.equation || ""}`.toLowerCase();
    const liveBadge = document.getElementById("liveStatusBadge");
    const resultDetected = /(won by|lost by|match over|match finished|match completed|no result|abandoned|match tied|\btied\b|\bdrawn\b)/.test(combinedMatchStatus);
    if (liveBadge) {
        liveBadge.textContent = resultDetected ? "RESULT" : "LIVE";
        liveBadge.classList.toggle("result", resultDetected);
    }
    if (statusUpper.includes("OPT") && statusUpper.includes("BOWL")) {
        if (statusUpper.includes(t1Short)) {
            battingScore = apiTeam2.score ? String(apiTeam2.score) : battingScore;
            battingOvers = apiTeam2.overs ? String(apiTeam2.overs).replace(/[()]/g, "") : battingOvers;
            battingTeam = t2Short;
        }
    }

    document.getElementById("mainScoreTag").textContent = battingTeam;
    document.getElementById("mainScoreHero").textContent = battingScore.replace("-", "/");
    document.getElementById("mainOversHero").textContent = battingOvers;

    // Current Over Balls
    const activeBalls = Array.isArray(data.current_over?.balls) ? data.current_over.balls : [];
    renderCurrentOverBalls(activeBalls);

    // REQUESTED SECTIONS UPDATE: TARGET, PARTNERSHIP, RRR, LAST WICKET
    document.getElementById("valTarget").textContent = (data.target !== undefined && data.target !== null && String(data.target).trim() !== "") ? data.target : "--";
    document.getElementById("valPartnership").textContent = data.partnership ?? "--";
    document.getElementById("valRRR").textContent = data.rrr ?? "--";
    document.getElementById("valLastWkt").textContent = data.last_wicket || "--";

    // Batters
    const b1 = data.batsman1 || data.batter1;
    if (b1) {
        document.getElementById("b1Name").textContent = String(b1.short_name || b1.name || "BATTER 1").toUpperCase();
        document.getElementById("b1Runs").textContent = b1.runs ?? 0;
        document.getElementById("b1Balls").textContent = b1.balls ?? 0;
        document.getElementById("b1Fours").textContent = b1.fours ?? 0;
        document.getElementById("b1Sixes").textContent = b1.sixes ?? 0;
        document.getElementById("b1SR").textContent = b1.sr ?? "0.0";
        if (b1.on_strike) document.getElementById("b1Runs").className = "striker-highlight";
        else document.getElementById("b1Runs").className = "";
    }

    const b2 = data.batsman2 || data.batter2;
    if (b2) {
        document.getElementById("b2Name").textContent = String(b2.short_name || b2.name || "BATTER 2").toUpperCase();
        document.getElementById("b2Runs").textContent = b2.runs ?? 0;
        document.getElementById("b2Balls").textContent = b2.balls ?? 0;
        document.getElementById("b2Fours").textContent = b2.fours ?? 0;
        document.getElementById("b2Sixes").textContent = b2.sixes ?? 0;
        document.getElementById("b2SR").textContent = b2.sr ?? "0.0";
        if (b2.on_strike) document.getElementById("b2Runs").className = "striker-highlight";
        else document.getElementById("b2Runs").className = "";
    }

    // Bowler
    const bowler = data.bowler;
    if (bowler) {
        document.getElementById("bwlName").textContent = String(bowler.short_name || bowler.name || "BOWLER").toUpperCase();
        document.getElementById("bwlOvers").textContent = String(bowler.overs ?? "0.0").replace(/[()]/g, "");
        document.getElementById("bwlMaidens").textContent = bowler.maidens ?? 0;
        document.getElementById("bwlRuns").textContent = bowler.runs ?? (bowler.figures ? bowler.figures.split("-")[1] : 0);
        document.getElementById("bwlWickets").textContent = bowler.wickets ?? (bowler.figures ? bowler.figures.split("-")[0] : 0);
        document.getElementById("bwlEco").textContent = bowler.econ ?? "0.00";
    }

    // Bottom Ribbon
    if (data.crr !== undefined && data.crr !== null && data.crr !== "") document.getElementById("ribbonCRR").textContent = data.crr;
    
    // Projected score: cricket overs are balls notation (19.3 = 19 overs + 3 balls), not decimal 19.3.
    const scoreParts = String(battingScore).split(/[/-]/);
    const runNum = Number.parseInt(scoreParts[0], 10) || 0;
    const wicketsLost = Number.parseInt(scoreParts[1], 10) || 0;
    const overMatch = String(battingOvers).match(/^(\d+)(?:\.(\d+))?$/);
    const completedOvers = overMatch ? Number.parseInt(overMatch[1], 10) : 0;
    const ballsInOver = overMatch && overMatch[2] ? Math.min(5, Number.parseInt(overMatch[2], 10) || 0) : 0;
    const legalBalls = completedOvers * 6 + ballsInOver;
    const matchContext = `${activeTargetUrl || ""} ${data.format || data.match_type || data.matchType || ""}`.toLowerCase();
    const explicitLimit = Number(data.max_overs || data.overs_limit || data.match_overs || 0);
    let maxOvers = explicitLimit > 0 ? explicitLimit : 20;
    if (!explicitLimit) {
        if (/t10|\b10.?over/.test(matchContext)) maxOvers = 10;
        else if (/\bodi\b|one.day/.test(matchContext)) maxOvers = 50;
        else if (/\btest\b/.test(matchContext)) maxOvers = null;
    }
    const maxBalls = maxOvers ? maxOvers * 6 : null;
    const statusText = `${data.status || ""} ${data.equation || ""}`.toLowerCase();
    const completeByStatus = /(innings complete|innings over|all out|all-out|match over|match finished|won by|drawn)/.test(statusText);
    const inningsComplete = wicketsLost >= 10 || (maxBalls !== null && legalBalls >= maxBalls) || completeByStatus;
    const projLabel = document.getElementById("ribbonProjLabel");
    const projValue = document.getElementById("ribbonProj");
    if (inningsComplete) {
        if (projLabel) projLabel.textContent = "INNINGS STATUS";
        if (projValue) projValue.textContent = wicketsLost >= 10 ? `ALL OUT • ${runNum}` : `INNINGS COMPLETE • ${runNum}`;
    } else if (projLabel && projValue) {
        if (maxOvers && maxBalls) {
            projLabel.textContent = "PROJECTED SCORE";
            const projected = legalBalls > 0 ? Math.round((runNum / legalBalls) * maxBalls) : null;
            projValue.textContent = projected === null ? `— (${maxOvers} OVERS)` : `${projected} (${maxOvers} OVERS)`;
        } else {
            projLabel.textContent = "CURRENT RUN RATE";
            projValue.textContent = data.crr ?? "—";
        }
    }

    if (data.equation || data.status) {
        document.getElementById("ribbonToss").textContent = String(data.equation || data.status).toUpperCase();
    }
}

async function fetchScores() {
    if (fetchInProgress) {
        if (Date.now() - lastFetchAttemptTimestamp > 12000) fetchInProgress = false;
        else return;
    }

    fetchInProgress = true;
    lastFetchAttemptTimestamp = Date.now();
    setConnectionStatus("SYNCING...", "#FFB800");

    const controller = new AbortController();
    const timeoutId = setTimeout(() => { try { controller.abort(); } catch(e){} }, REQUEST_TIMEOUT);

    try {
        let fetchEndpoint = "";
        if (OBS_TOKEN) {
            fetchEndpoint = `${API_BASE}/api/obs/${encodeURIComponent(OBS_TOKEN)}/scrape?t=${Date.now()}`;
        } else if (activeTargetUrl) {
            fetchEndpoint = `${API_BASE}/api/scrape?url=${encodeURIComponent(activeTargetUrl)}&t=${Date.now()}`;
        } else {
            setConnectionStatus("AWAITING URL", "#FFB800");
            return;
        }

        const res = await fetch(fetchEndpoint, {
            method: "GET",
            cache: "no-store",
            mode: "cors",
            signal: controller.signal
        });

        const rawText = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = JSON.parse(rawText);
        renderScoreData(data);
        setConnectionStatus("LIVE • SYNCED", "#6cf598");

    } catch (err) {
        setConnectionStatus("RETRYING...", "#ff9d00");
    } finally {
        clearTimeout(timeoutId);
        fetchInProgress = false;
        setTimeout(fetchScores, POLL_INTERVAL);
    }
}

async function triggerMatchLoad() {
    let rawVal = urlInput.value.trim();
    if (!rawVal) return;

    const target = normalizeInput(rawVal);
    activeTargetUrl = target;
    localStorage.setItem("crex_match_input", target);
    urlInput.value = target;
    applyUrlFlagsImmediately(target);

    setConnectionStatus("CONNECTING...", "#FFB800");

    try {
        await fetch(`${API_BASE}/api/default-url`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: target })
        });
    } catch (e) {}

    fetchScores();
}

document.getElementById("loadMatchUrlBtn").addEventListener("click", triggerMatchLoad);

document.getElementById("generateObsBtn").addEventListener("click", async () => {
    const crexUrl = normalizeInput(urlInput.value.trim());
    try {
        const response = await fetch(`${API_BASE}/api/obs-token`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: crexUrl })
        });
        const data = await response.json();
        const obsUrl = `${window.location.origin}${window.location.pathname}?token=${encodeURIComponent(data.token)}&hide=1`;
        await navigator.clipboard.writeText(obsUrl);
        alert("OBS Browser Source URL copied!\n\n" + obsUrl);
    } catch (e) {
        alert("Error generating OBS URL");
    }
});

urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") triggerMatchLoad();
});

if (urlParams.get("hide") === "1" || urlParams.get("obs") === "1") {
    const bar = document.getElementById("urlControlBar");
    if (bar) bar.classList.add("hidden-obs");
    document.body.classList.remove("controls-visible");
} else {
    document.body.classList.add("controls-visible");
}

window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "h" || e.key === "H") {
        const bar = document.getElementById("urlControlBar");
        if (bar) {
            bar.classList.toggle("hidden-obs");
            document.body.classList.toggle("controls-visible", !bar.classList.contains("hidden-obs"));
        }
    }
});

window.addEventListener("load", () => {
    if (activeTargetUrl) applyUrlFlagsImmediately(activeTargetUrl);
    fetchScores();
});
</script>
