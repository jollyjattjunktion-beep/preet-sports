<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Preet Sports Live Scoreboard - 1280x720</title>
<style>
/* =========================================================
   BASE RESET
========================================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #120103;
    font-family: Arial, Helvetica, sans-serif;
}

.screen-wrapper {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* FLOATING URL CONTROL BAR */
.url-control-bar {
    position: absolute;
    top: 8px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(28, 4, 7, 0.94);
    border: 2px solid #d5b500;
    border-radius: 30px;
    padding: 5px 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.85);
    width: 90%;
    max-width: 920px;
}
.url-control-bar span {
    color: #e8c98f;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
}
.url-control-bar input {
    flex: 1;
    background: #2b060b;
    border: 1px solid #d5b500;
    border-radius: 18px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    outline: none;
}
.url-control-bar button {
    background: linear-gradient(180deg, #d5b500, #967000);
    border: none;
    border-radius: 18px;
    color: #150103;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 16px;
    cursor: pointer;
    white-space: nowrap;
}
.url-control-bar button:active {
    transform: scale(0.96);
}
.status-indicator {
    font-size: 11px;
    font-weight: bold;
    color: #6cf598;
    white-space: nowrap;
}

/* =========================================================
   EXACT 1280 × 720 CANVAS
========================================================= */
.scoreboard {
    position: relative;
    width: 1280px;
    height: 720px;
    min-width: 1280px;
    min-height: 720px;
    background: linear-gradient(
        180deg,
        #230300 0%,
        #3d0804 25%,
        #180000 100%
    );
    border: 3px solid #d5b500;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    transform-origin: center center;
    flex-shrink: 0;
}

/* =========================================================
   TOP SECTION (BROADCAST SCORE DISPLAY)
========================================================= */
.top-section {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 185px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

/* LEFT SIDE: 4K CIRCLE CREST + NAME PILL + BIG SCORE + OVERS PILL */
.left-team-display {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 440px;
}

.team-logo-circle {
    width: 138px;
    height: 138px;
    border-radius: 50%;
    border: 5px solid #ffd700;
    background: radial-gradient(circle, #2a0408 0%, #150003 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 
        0 0 0 3px #b8860b,
        0 0 25px rgba(255, 215, 0, 0.45),
        inset 0 0 16px rgba(0, 0, 0, 0.85),
        0 6px 20px rgba(0, 0, 0, 0.75);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
}

.team-logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: high-quality;
    transform: translateZ(0);
    display: none;
}

.team-info-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
}

.team-badge-pill {
    background: #1b0305;
    border: 2px solid #d5b500;
    border-radius: 6px;
    padding: 3px 14px;
    color: #ffffff;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
}

.team-big-score {
    font-size: 58px;
    font-weight: 900;
    color: #ffd700;
    line-height: 1.05;
    letter-spacing: 1.5px;
    text-shadow: 3px 3px 6px #000;
    margin: 2px 0;
}

.team-overs-pill {
    background: #1a0204;
    border: 1.5px solid #d5b500;
    border-radius: 14px;
    padding: 3px 16px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
}

/* CENTER BOX: NEON CYAN ROUNDED BORDER */
.center-panel {
    width: 250px;
    height: 110px;
    border: 3.5px solid #00d2ff;
    border-radius: 24px;
    background: rgba(0, 18, 30, 0.94);
    box-shadow: 0 0 22px rgba(0, 210, 255, 0.55), inset 0 0 15px rgba(0, 210, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    z-index: 10;
}

.center-live-action {
    font-size: 58px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 0 14px rgba(0, 210, 255, 0.8), 2px 2px 4px #000;
}

/* CHASE EQUATION UNDER THE MIDDLE BOX */
.center-chase-equation {
    position: absolute;
    left: 0;
    right: 0;
    top: 150px;
    margin: 0 auto;
    text-align: center;
    font-size: 16px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 0.5px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 2px 2px 4px #000;
    white-space: nowrap;
    z-index: 12;
}

/* RIGHT SIDE: NAME PILL + BIG SCORE + OVERS PILL + CREST */
.right-team-display {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    width: 440px;
}

.right-team-display .team-info-stack {
    align-items: flex-end;
}

/* SMALL CRICKET BALL FOR TEAM BADGE */
.badge-ball-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff4d4d, #990000);
    border: 1px solid #ffffff;
    display: inline-block;
}

/* STATS ROW */
.info-row {
    position: absolute;
    left: 0;
    top: 188px;
    width: 100%;
    height: 105px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 0 6px;
}

.info-box {
    position: relative;
    height: 100px;
    border: 2px solid #e9d77a;
    border-radius: 18px;
    background: radial-gradient(
        ellipse at center top,
        rgba(255, 170, 0, 0.45),
        rgba(75, 38, 0, 0.96) 42%,
        rgba(20, 10, 0, 0.98) 100%
    );
    box-shadow: inset 0 0 25px rgba(255, 145, 0, 0.25);
}

.info-label {
    position: absolute;
    left: 0;
    right: 0;
    top: 14px;
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: #e7d76c;
    letter-spacing: 1px;
}

.info-value {
    position: absolute;
    left: 0;
    right: 0;
    top: 44px;
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 2px 2px 3px #000;
}

/* MAGENTA OVER TICKER */
.magenta-divider {
    position: absolute;
    left: 0;
    top: 298px;
    width: 100%;
    height: 48px;
    background: linear-gradient(
        180deg,
        #f000c7 0%,
        #bf00aa 35%,
        #81006d 100%
    );
    border-top: 2px solid #e5d000;
    border-bottom: 2px solid #e5d000;
    box-shadow:
        inset 0 4px 8px rgba(255, 255, 255, 0.18),
        inset 0 -6px 10px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 16px;
    overflow: hidden;
}

.over-column {
    display: flex;
    align-items: center;
    gap: 8px;
}

.over-title {
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 3px #000;
    white-space: nowrap;
}

.balls-container {
    display: flex;
    align-items: center;
    gap: 6px;
}

.ball-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #170007;
    border: 2px solid #ffd700;
    color: #ffffff;
    font-size: 14px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
}

.ball-circle.four { background: #0275d8; border-color: #70baff; }
.ball-circle.six { background: #029432; border-color: #6cf598; }
.ball-circle.wicket { background: #d90429; border-color: #ff8a9a; }
.ball-circle.extra { background: #d97706; border-color: #fed7aa; }

.over-total {
    font-size: 17px;
    font-weight: 900;
    color: #ffe066;
    margin-left: 4px;
    text-shadow: 1px 1px 3px #000;
}

.over-divider-line {
    width: 2px;
    height: 30px;
    background: rgba(255, 255, 255, 0.45);
    flex-shrink: 0;
}

.ticker-info-block {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.ticker-info-label {
    font-size: 16px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 3px #000;
}

.ticker-info-val {
    font-size: 17px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 3px #000;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* NEXT BATTERS — uses the empty space above the current player cards */
.next-batters-panel {
    position: absolute;
    left: 0;
    top: 358px;
    width: 100%;
    height: 128px;
    padding: 4px 18px 0;
    z-index: 8;
}

.next-batters-title {
    text-align: center;
    color: #ffd700;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 2px 2px 4px #000;
    margin-bottom: 8px;
}

.next-batters-grid {
    width: 100%;
    height: 94px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 7px 10px;
}

.next-batter-item {
    min-width: 0;
    border: 1.5px solid #d7b900;
    border-radius: 10px;
    background: linear-gradient(90deg, #190003, #4d0010, #190003);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 19px;
    font-weight: 900;
    text-shadow: 2px 2px 3px #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 10px;
}

.next-batter-item.empty {
    visibility: hidden;
}

/* BOTTOM PLAYERS SECTION (3 COLUMNS) */
.player-section {
    position: absolute;
    left: 0;
    top: 500px;
    width: 100%;
    height: 190px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 0 6px;
}

.player-col {
    display: flex;
    flex-direction: column;
    position: relative;
}

.player-card {
    position: relative;
    height: 122px;
    overflow: hidden;
    border: 2px solid #d7b900;
    border-radius: 16px;
    background: linear-gradient(
        110deg,
        #300006 0%,
        #710014 35%,
        #c51b3a 50%,
        #73000e 70%,
        #280004 100%
    );
}

.player-card::before {
    content: "";
    position: absolute;
    left: 190px;
    top: -30px;
    width: 90px;
    height: 180px;
    transform: rotate(18deg);
    background: rgba(255, 255, 255, 0.15);
}

.player-image {
    position: absolute;
    left: 8px;
    top: 0px;
    width: 115px;
    height: 115px;
    border-radius: 50%;
    border: 5px solid #d9bd00;
    background: radial-gradient(circle, #9a9a9a 0%, #666666 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
}
.player-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: none;
}

.player-data {
    position: absolute;
    left: 135px;
    right: 10px;
    top: 14px;
    z-index: 5;
    color: #ffffff;
    text-align: left;
}

.player-name {
    font-size: 22px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 2px 2px 3px #000;
}

.player-score {
    margin-top: 8px;
    font-size: 30px;
    font-weight: 900;
    text-shadow: 2px 2px 3px #000;
    display: flex;
    align-items: center;
}

.icon-badge {
    margin-left: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.bat-svg {
    width: 28px;
    height: 28px;
    transform: rotate(-30deg);
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.85));
}

.ball-svg {
    width: 26px;
    height: 26px;
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.85));
}

.player-bottom-col {
    margin-top: 4px;
    height: 48px;
    border: 2px solid #d7b900;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        #170000,
        #36000c,
        #170000
    );
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    color: #ffd700;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 0.5px;
}
.player-bottom-col .stat-item {
    display: flex;
    align-items: baseline;
    gap: 4px;
}
.player-bottom-col .stat-val {
    color: #ffffff;
}
</style>
</head>

<body>

<div class="screen-wrapper">

    <!-- FLOATING CONTROL BAR -->
    <div class="url-control-bar" id="urlControlBar">
        <span>CREX MATCH:</span>
        <input type="text" id="crexUrlInput" placeholder="Paste CREX URL or Match ID...">
        <button id="loadMatchUrlBtn">LOAD MATCH</button>
        <span class="status-indicator" id="statusIndicator">Ready</span>
    </div>

    <!-- 1280x720 BOARD CANVAS -->
    <div class="scoreboard" id="scoreboardCanvas">

        <!-- TOP SECTION -->
        <div class="top-section">

            <!-- TEAM 1 (LEFT): 4K CIRCLE CREST + NAME PILL + SCORE + OVERS -->
            <div class="left-team-display">
                <div class="team-logo-circle">
                    <img id="team1Logo" src="" alt="Team 1 Logo">
                </div>
                <div class="team-info-stack">
                    <div class="team-badge-pill" id="team1BadgeBox">
                        <span id="team1BallIcon" class="badge-ball-icon" style="display: none;"></span>
                        <span id="team1Badge">KP</span>
                    </div>
                    <div class="team-big-score" id="team1Score">-</div>
                    <div class="team-overs-pill" id="team1Overs">OVERS: 0.0</div>
                </div>
            </div>

            <!-- CENTER: CYAN RECTANGULAR BOX -->
            <div class="center-panel">
                <div id="centerLiveAction" class="center-live-action">•</div>
            </div>

            <!-- CHASE EQUATION UNDER MIDDLE BOX -->
            <div id="centerChaseEquation" class="center-chase-equation" style="display: none;"></div>

            <!-- TEAM 2 (RIGHT): NAME PILL + SCORE + OVERS + 4K CIRCLE CREST -->
            <div class="right-team-display">
                <div class="team-info-stack">
                    <div class="team-badge-pill" id="team2BadgeBox">
                        <span id="team2BallIcon" class="badge-ball-icon" style="display: none;"></span>
                        <span id="team2Badge">PT</span>
                    </div>
                    <div class="team-big-score" id="team2Score">-</div>
                    <div class="team-overs-pill" id="team2Overs">OVERS: 0.0</div>
                </div>
                <div class="team-logo-circle">
                    <img id="team2Logo" src="" alt="Team 2 Logo">
                </div>
            </div>

        </div>

        <!-- STATS ROW -->
        <div class="info-row">
            <div class="info-box">
                <div class="info-label">CRR</div>
                <div id="crr" class="info-value">--</div>
            </div>
            <div class="info-box">
                <div class="info-label">RRR</div>
                <div id="rrr" class="info-value">--</div>
            </div>
            <div class="info-box">
                <div class="info-label">PARTNERSHIP</div>
                <div id="partnership" class="info-value">--</div>
            </div>
            <div class="info-box">
                <div class="info-label">TARGET</div>
                <div id="target" class="info-value">--</div>
            </div>
        </div>

        <!-- MAGENTA OVER TICKER -->
        <div class="magenta-divider" id="oversTicker">
            <div class="over-column">
                <span class="over-title">Over --</span>
                <div class="balls-container">
                    <div class="ball-circle">•</div>
                </div>
            </div>
        </div>

        <!-- NEXT BATTERS — dynamically populated from CREX -->
        <div class="next-batters-panel" id="nextBattersPanel">
            <div class="next-batters-title">NEXT BATTERS</div>
            <div class="next-batters-grid" id="nextBattersGrid"></div>
        </div>

        <!-- BOTTOM ROW DIVIDED INTO THREE INDIVIDUAL COLUMNS -->
        <div class="player-section">
            <!-- COLUMN 1: BATTER 1 -->
            <div class="player-col">
                <div class="player-card">
                    <div class="player-image">
                        <img id="player1Image" src="" alt="">
                    </div>
                    <div class="player-data">
                        <div id="player1Name" class="player-name">Batter 1</div>
                        <div class="player-score">
                            <span id="player1Score">-</span>
                            <span id="b1BatIcon" class="icon-badge" style="display: none;">
                                <svg class="bat-svg" viewBox="0 0 32 32">
                                    <rect x="14.5" y="1" width="3" height="10" rx="1.5" fill="#f8f9fa" stroke="#222" stroke-width="0.8"/>
                                    <line x1="14.5" y1="3" x2="17.5" y2="3" stroke="#e63946" stroke-width="1.2"/>
                                    <line x1="14.5" y1="6" x2="17.5" y2="6" stroke="#e63946" stroke-width="1.2"/>
                                    <path d="M13.5 11 L18.5 11 L19 28 C19 30 13 30 13 28 Z" fill="#d4a373" stroke="#78350f" stroke-width="1.2"/>
                                    <path d="M15.5 12 L16.5 12 L16.5 28 L15.5 28 Z" fill="#b08968" opacity="0.6"/>
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="player-bottom-col">
                    <span class="stat-item">4<span class="stat-val" id="b1Fours">(0)</span></span>
                    <span class="stat-item">6<span class="stat-val" id="b1Sixes">(0)</span></span>
                    <span class="stat-item">SR: <span class="stat-val" id="b1SR">0.00</span></span>
                </div>
            </div>

            <!-- COLUMN 2: BATTER 2 -->
            <div class="player-col">
                <div class="player-card">
                    <div class="player-image">
                        <img id="player2Image" src="" alt="">
                    </div>
                    <div class="player-data">
                        <div id="player2Name" class="player-name">Batter 2</div>
                        <div class="player-score">
                            <span id="player2Score">-</span>
                            <span id="b2BatIcon" class="icon-badge" style="display: none;">
                                <svg class="bat-svg" viewBox="0 0 32 32">
                                    <rect x="14.5" y="1" width="3" height="10" rx="1.5" fill="#f8f9fa" stroke="#222" stroke-width="0.8"/>
                                    <line x1="14.5" y1="3" x2="17.5" y2="3" stroke="#e63946" stroke-width="1.2"/>
                                    <line x1="14.5" y1="6" x2="17.5" y2="6" stroke="#e63946" stroke-width="1.2"/>
                                    <path d="M13.5 11 L18.5 11 L19 28 C19 30 13 30 13 28 Z" fill="#d4a373" stroke="#78350f" stroke-width="1.2"/>
                                    <path d="M15.5 12 L16.5 12 L16.5 28 L15.5 28 Z" fill="#b08968" opacity="0.6"/>
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="player-bottom-col">
                    <span class="stat-item">4<span class="stat-val" id="b2Fours">(0)</span></span>
                    <span class="stat-item">6<span class="stat-val" id="b2Sixes">(0)</span></span>
                    <span class="stat-item">SR: <span class="stat-val" id="b2SR">0.00</span></span>
                </div>
            </div>

            <!-- COLUMN 3: BOWLER -->
            <div class="player-col">
                <div class="player-card">
                    <div class="player-image">
                        <img id="bowlerImage" src="" alt="">
                    </div>
                    <div class="player-data">
                        <div id="bowlerName" class="player-name">Bowler</div>
                        <div class="player-score">
                            <span id="bowlerScore">-</span>
                            <span class="icon-badge">
                                <svg class="ball-svg" viewBox="0 0 32 32">
                                    <defs>
                                        <radialGradient id="cricketBallGrad" cx="35%" cy="35%" r="65%">
                                            <stop offset="0%" stop-color="#ff4d4d"/>
                                            <stop offset="55%" stop-color="#b30000"/>
                                            <stop offset="100%" stop-color="#590000"/>
                                        </radialGradient>
                                    </defs>
                                    <circle cx="16" cy="16" r="13" fill="url(#cricketBallGrad)" stroke="#800000" stroke-width="1.2"/>
                                    <path d="M7 9 C13 13 19 19 25 23" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="2,1.5"/>
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="player-bottom-col">
                    <span class="stat-item">Eco : <span class="stat-val" id="bowlerEcon">0.00</span></span>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
function fitScoreboardToWindow() {
    const el = document.getElementById("scoreboardCanvas");
    if (!el) return;

    const targetW = 1280;
    const targetH = 720;
    const winW = window.innerWidth || document.documentElement.clientWidth || 1280;
    const winH = window.innerHeight || document.documentElement.clientHeight || 720;

    if (winW <= 0 || winH <= 0) return;

    const scale = Math.min(winW / targetW, winH / targetH);
    const finalScale = (!isNaN(scale) && scale > 0.05) ? scale : 1;

    el.style.transformOrigin = "center center";
    el.style.transform = `scale(${finalScale})`;
}

window.addEventListener("resize", fitScoreboardToWindow);
window.addEventListener("orientationchange", fitScoreboardToWindow);
document.addEventListener("DOMContentLoaded", fitScoreboardToWindow);
fitScoreboardToWindow();

const API_BASE = "https://preet-sports-api-3.onrender.com";

function cleanCrexUrl(url) {
    if (!url) return "";
    let clean = url.trim().replace(/\.+$/, "");
    clean = clean.split("#")[0];
    clean = clean.split("?")[0];
    return clean.trim();
}

function normalizeInput(val) {
    if (!val) return "";
    let clean = cleanCrexUrl(val);
    if (!clean.startsWith("http") && clean.length <= 8) {
        clean = `https://crex.com/cricket-live-score/match-updates-${clean.toUpperCase()}`;
    }
    return clean;
}

const urlParams = new URLSearchParams(window.location.search);
let activeTargetUrl =
    normalizeInput(urlParams.get("url")) ||
    localStorage.getItem("crex_match_input") ||
    "https://crex.com/cricket-live-score/kp-vs-pt-16th-match-odisha-t20-league-2026-match-updates-13VH";

const urlInput = document.getElementById("crexUrlInput");
const statusInd = document.getElementById("statusIndicator");
urlInput.value = activeTargetUrl;

function flushDomElementsInstantly() {
    document.getElementById("team1Score").textContent = "-";
    document.getElementById("team2Score").textContent = "-";
    document.getElementById("team1Overs").textContent = "OVERS: 0.0";
    document.getElementById("team2Overs").textContent = "OVERS: 0.0";
    document.getElementById("centerLiveAction").textContent = "•";
    document.getElementById("centerChaseEquation").style.display = "none";
    document.getElementById("crr").textContent = "--";
    document.getElementById("rrr").textContent = "--";
    document.getElementById("partnership").textContent = "--";
    document.getElementById("target").textContent = "--";
    document.getElementById("player1Name").textContent = "Batter 1";
    document.getElementById("player1Score").textContent = "-";
    document.getElementById("b1Fours").textContent = "(0)";
    document.getElementById("b1Sixes").textContent = "(0)";
    document.getElementById("b1SR").textContent = "0.00";
    document.getElementById("b1BatIcon").style.display = "none";
    document.getElementById("player2Name").textContent = "Batter 2";
    document.getElementById("player2Score").textContent = "-";
    document.getElementById("b2Fours").textContent = "(0)";
    document.getElementById("b2Sixes").textContent = "(0)";
    document.getElementById("b2SR").textContent = "0.00";
    document.getElementById("b2BatIcon").style.display = "none";
    document.getElementById("bowlerName").textContent = "Bowler";
    document.getElementById("bowlerScore").textContent = "-";
    document.getElementById("bowlerEcon").textContent = "0.00";
    renderNextBatters([]);
}



function renderImageInCircle(elementId, imageUrl) {
    const el = document.getElementById(elementId);
    if (!el) return;
    if (imageUrl && typeof imageUrl === "string" && imageUrl.startsWith("http")) {
        let highResUrl = imageUrl.replace(/(\?|&)(w|width|h|height)=\d+/gi, "");
        el.src = highResUrl;
        el.style.display = "block";
        el.onerror = () => { el.style.display = "none"; };
    } else {
        el.style.display = "none";
    }
}

function renderNextBatters(nextBatters) {
    const grid = document.getElementById("nextBattersGrid");
    if (!grid) return;

    grid.innerHTML = "";

    const list = Array.isArray(nextBatters)
        ? nextBatters
            .map((p) => {
                if (typeof p === "string") return p.trim();
                if (p && typeof p === "object") return String(p.short_name || p.name || "").trim();
                return "";
            })
            .filter(Boolean)
        : [];

    if (!list.length) {
        document.getElementById("nextBattersPanel").style.display = "none";
        return;
    }

    document.getElementById("nextBattersPanel").style.display = "block";

    list.slice(0, 8).forEach((name) => {
        const item = document.createElement("div");
        item.className = "next-batter-item";
        item.textContent = name;
        item.title = name;
        grid.appendChild(item);
    });

    while (grid.children.length < 8) {
        const empty = document.createElement("div");
        empty.className = "next-batter-item empty";
        grid.appendChild(empty);
    }
}

function renderOversTicker(recentOvers, lastWicket, nextBatsman) {
    const ticker = document.getElementById("oversTicker");
    ticker.innerHTML = "";

    if (recentOvers && recentOvers.length) {
        recentOvers.forEach((o) => {
            const col = document.createElement("div");
            col.className = "over-column";

            const title = document.createElement("span");
            title.className = "over-title";
            title.textContent = `Over ${o.over}`;
            col.appendChild(title);

            const ballsBox = document.createElement("div");
            ballsBox.className = "balls-container";

            (o.balls || []).forEach((b) => {
                const ball = document.createElement("div");
                ball.className = "ball-circle";
                ball.textContent = b;

                if (b === "4") ball.classList.add("four");
                else if (b === "6") ball.classList.add("six");
                else if (b.toLowerCase().includes("w") && !b.toLowerCase().includes("wd")) ball.classList.add("wicket");
                else if (b.toLowerCase().includes("wd") || b.toLowerCase().includes("nb")) ball.classList.add("extra");

                ballsBox.appendChild(ball);
            });

            col.appendChild(ballsBox);

            if (o.total !== undefined) {
                const total = document.createElement("span");
                total.className = "over-total";
                total.textContent = `= ${o.total}`;
                col.appendChild(total);
            }

            ticker.appendChild(col);

            const sep = document.createElement("div");
            sep.className = "over-divider-line";
            ticker.appendChild(sep);
        });
    }

    const lwBlock = document.createElement("div");
    lwBlock.className = "ticker-info-block";
    lwBlock.innerHTML = `
        <span class="ticker-info-label">LAST WKT:</span>
        <span class="ticker-info-val" title="${lastWicket || '-'}">${lastWicket || '-'}</span>
    `;
    ticker.appendChild(lwBlock);

    if (nextBatsman && nextBatsman !== "-") {
        const sep2 = document.createElement("div");
        sep2.className = "over-divider-line";
        ticker.appendChild(sep2);

        const nbBlock = document.createElement("div");
        nbBlock.className = "ticker-info-block";
        nbBlock.innerHTML = `
            <span class="ticker-info-label">NEXT BAT:</span>
            <span class="ticker-info-val" title="${nextBatsman}">${nextBatsman}</span>
        `;
        ticker.appendChild(nbBlock);
    }
}

/* =========================================================
   PREET SPORTS — RELIABLE LIVE SCORE ENGINE
   3-second polling + automatic reconnect + last-success protection
   ========================================================= */

let fetchInProgress = false;
let retryTimer = null;
let lastSuccessfulData = null;
let lastSuccessfulTimestamp = 0;

const POLL_INTERVAL = 3000; // retry 3 seconds AFTER each request finishes
const REQUEST_TIMEOUT = 90000;

function cacheKeyForUrl(url) {
    return "preet_sports_last_score_" + btoa(unescape(encodeURIComponent(url))).replace(/[^a-zA-Z0-9_-]/g, "_");
}

function saveLastSuccessfulData(data) {
    try {
        lastSuccessfulData = data;
        lastSuccessfulTimestamp = Date.now();

        const key = cacheKeyForUrl(activeTargetUrl);
        localStorage.setItem(key, JSON.stringify({
            timestamp: lastSuccessfulTimestamp,
            data: data
        }));
    } catch (e) {
        // Storage failure must never stop live scoring.
    }
}

function restoreLastSuccessfulData() {
    try {
        const key = cacheKeyForUrl(activeTargetUrl);
        const raw = localStorage.getItem(key);
        if (!raw) return false;

        const cached = JSON.parse(raw);
        if (!cached || !cached.data || cached.data.success === false) return false;

        lastSuccessfulData = cached.data;
        lastSuccessfulTimestamp = Number(cached.timestamp || 0);

        renderScoreData(lastSuccessfulData, true);
        return true;
    } catch (e) {
        return false;
    }
}

function scheduleNextFetch(delay = POLL_INTERVAL) {
    if (retryTimer) clearTimeout(retryTimer);

    retryTimer = setTimeout(() => {
        retryTimer = null;
        fetchScores();
    }, delay);
}

function setConnectionStatus(text, color) {
    statusInd.textContent = text;
    statusInd.style.color = color;
    statusInd.title = text;
}

/* Render ONLY after a valid successful response.
   This is the last-successful-score protection: failed requests
   never clear or overwrite the scoreboard. */
function renderScoreData(data, fromCache = false) {
    if (!data || data.success === false) {
        throw new Error("Invalid score data");
    }

    /* =========================================================
       NORMALIZE CURRENT CREX PLAYWRIGHT API SCHEMA
       API returns:
       team1/team2 as objects,
       batsman1/batsman2,
       bowler.img,
       structured_overs.
       This keeps the existing scoreboard design unchanged.
       ========================================================= */

    const apiTeam1 = (data.team1 && typeof data.team1 === "object") ? data.team1 : {};
    const apiTeam2 = (data.team2 && typeof data.team2 === "object") ? data.team2 : {};

    // Team names: prefer full_name, then short, then fixture text.
    const t1Name = String(
        apiTeam1.full_name ||
        apiTeam1.short ||
        (typeof data.team1 === "string" ? data.team1 : "") ||
        "TEAM 1"
    ).toUpperCase();

    let t2Name = String(
        apiTeam2.full_name ||
        apiTeam2.short ||
        (typeof data.team2 === "string" ? data.team2 : "") ||
        "TEAM 2"
    ).toUpperCase();

    // CREX fixture is AUS vs SA. The API's team2.short can currently
    // contain "SA", so use full_name first and fixture text as fallback.
    if (apiTeam2.full_name) {
        t2Name = String(apiTeam2.full_name).toUpperCase();
    }

    // Broadcast-friendly abbreviations.
    const abbreviation = (name) => {
        const n = String(name || "").toUpperCase();
        if (n.includes("SOUTH AFRICA")) return "SA";
        if (n.includes("AUSTRALIA")) return "AUS";
        if (n.includes("ENGLAND")) return "ENG";
        if (n.includes("SRI LANKA")) return "SL";
        if (n.includes("INDIA")) return "IND";
        if (n.includes("NEW ZEALAND")) return "NZ";
        if (n.includes("PAKISTAN")) return "PAK";
        if (n.includes("WEST INDIES")) return "WI";
        if (n.includes("ZIMBABWE")) return "ZIM";
        return n.length <= 8 ? n : n.split(/\s+/).map(x => x[0]).join("").slice(0, 4);
    };

    const t1Badge = abbreviation(t1Name);
    const t2Badge = abbreviation(t2Name);

    // Current API data says "AUS opt to Bowl", so South Africa is batting.
    const equationText = String(data.equation || data.status || "").trim();
    const australiaBowling = /AUS\s+opt\s+to\s+Bowl/i.test(equationText);

    let t1Score = apiTeam1.score ? String(apiTeam1.score).replace("/", "-") : "0-0";
    let t1Overs = apiTeam1.overs ? String(apiTeam1.overs).replace(/[()]/g, "") : "0.0";

    let t2Score = apiTeam2.score ? String(apiTeam2.score).replace("/", "-") : "0-0";
    let t2Overs = apiTeam2.overs ? String(apiTeam2.overs).replace(/[()]/g, "") : "0.0";

    let t1Role = "BOWLING";
    let t2Role = "BATTING";

    // If CREX says AUS opted to bowl, SA is the current batting side.
    if (australiaBowling) {
        t1Role = "BATTING";
        t2Role = "BOWLING";

        // The current API duplicates the live innings score into team2.
        // Do not display the duplicate score for the bowling side.
        if (t2Score === t1Score) {
            t2Score = "Yet to bat";
            t2Overs = "Yet to bat";
        }
    } else if (/SA\s+opt\s+to\s+Bowl/i.test(equationText)) {
        t1Role = "BOWLING";
        t2Role = "BATTING";

        if (t1Score === t2Score) {
            t1Score = "Yet to bat";
            t1Overs = "Yet to bat";
        }
    }

    // Team logos from nested API objects.
    renderImageInCircle("team1Logo", apiTeam1.logo || data.team1Logo);
    renderImageInCircle("team2Logo", apiTeam2.logo || data.team2Logo);

    document.getElementById("team1Badge").textContent = t1Badge;
    document.getElementById("team1Score").textContent = t1Score;
    document.getElementById("team1Overs").textContent = `OVERS: ${t1Overs}`;
    document.getElementById("team1BallIcon").style.display =
        (t1Role === "BOWLING") ? "inline-block" : "none";

    document.getElementById("team2Badge").textContent = t2Badge;
    document.getElementById("team2Score").textContent = t2Score;
    document.getElementById("team2Overs").textContent = `OVERS: ${t2Overs}`;
    document.getElementById("team2BallIcon").style.display =
        (t2Role === "BOWLING") ? "inline-block" : "none";

    // Center live ball.
    const actionEl = document.getElementById("centerLiveAction");
    const actionText = String(data.last_ball || data.liveBall || "•").trim();
    actionEl.textContent = actionText || "•";

    if (actionText.length <= 2) {
        actionEl.style.fontSize = "62px";
    } else if (actionText.length <= 6) {
        actionEl.style.fontSize = "42px";
    } else {
        actionEl.style.fontSize = "26px";
    }

    // Equation under center.
    const chaseEl = document.getElementById("centerChaseEquation");
    chaseEl.textContent = equationText || "";
    if (equationText) {
        chaseEl.style.display = "block";
    } else {
        chaseEl.style.display = "none";
    }

    // Convert structured_overs to the existing ticker format.
    const recentOvers = Array.isArray(data.structured_overs)
        ? data.structured_overs
        : (data.recentOvers || []);

    renderNextBatters(data.next_batsmen || data.nextBatsmen || []);
    renderOversTicker(recentOvers, data.last_wicket, data.nextBatsman);

    // Stats.
    document.getElementById("crr").textContent = data.crr ?? "--";
    document.getElementById("rrr").textContent = data.rrr ?? "--";
    document.getElementById("partnership").textContent = data.partnership || "--";
    document.getElementById("target").textContent =
        (data.target && data.target !== "") ? data.target : "--";

    // Normalize batsman1/batsman2 from current API.
    const b1 = data.batsman1 || data.batter1;
    const b2 = data.batsman2 || data.batter2;

    if (b1) {
        document.getElementById("player1Name").textContent =
            b1.short_name || b1.name || "Batter 1";

        document.getElementById("player1Score").textContent =
            `${b1.runs ?? 0} (${b1.balls ?? 0})`;

        document.getElementById("b1Fours").textContent = `(${b1.fours ?? 0})`;
        document.getElementById("b1Sixes").textContent = `(${b1.sixes ?? 0})`;
        document.getElementById("b1SR").textContent = b1.sr ?? "0.00";

        document.getElementById("b1BatIcon").style.display =
            b1.on_strike ? "inline-flex" : "none";

        renderImageInCircle("player1Image", b1.img || b1.image);
    }

    if (b2) {
        document.getElementById("player2Name").textContent =
            b2.short_name || b2.name || "Batter 2";

        document.getElementById("player2Score").textContent =
            `${b2.runs ?? 0} (${b2.balls ?? 0})`;

        document.getElementById("b2Fours").textContent = `(${b2.fours ?? 0})`;
        document.getElementById("b2Sixes").textContent = `(${b2.sixes ?? 0})`;
        document.getElementById("b2SR").textContent = b2.sr ?? "0.00";

        document.getElementById("b2BatIcon").style.display =
            b2.on_strike ? "inline-flex" : "none";

        renderImageInCircle("player2Image", b2.img || b2.image);
    }

    // Bowler.
    if (data.bowler) {
        const bowler = data.bowler;

        document.getElementById("bowlerName").textContent =
            bowler.short_name || bowler.name || "Bowler";

        document.getElementById("bowlerScore").textContent =
            bowler.figures || "-";

        document.getElementById("bowlerEcon").textContent =
            bowler.econ || "0.00";

        renderImageInCircle("bowlerImage", bowler.img || bowler.image);
    }

    if (fromCache) {
        setConnectionStatus("Cached • Reconnecting...", "#ffd700");
    }
}

async function fetchScores() {
    if (fetchInProgress) return;

    fetchInProgress = true;
    setConnectionStatus("SCRAPING LIVE DATA...", "#ffd700");

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);

    try {
        if (!activeTargetUrl) {
            throw new Error("No CREX match URL selected");
        }

        // IMPORTANT:
        // Send the CREX URL on EVERY request.
        // This avoids relying on Render's /api/default-url memory/state.
        const fetchEndpoint =
            `${API_BASE}/api/scrape?url=${encodeURIComponent(activeTargetUrl)}&t=${Date.now()}`;

        const res = await fetch(fetchEndpoint, {
            method: "GET",
            cache: "no-store",
            mode: "cors",
            signal: controller.signal,
            headers: {
                "Accept": "application/json"
            }
        });

        const rawText = await res.text();

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${rawText.slice(0, 180)}`);
        }

        let data;
        try {
            data = JSON.parse(rawText);
        } catch (e) {
            throw new Error(`API returned non-JSON: ${rawText.slice(0, 180)}`);
        }

        if (!data || data.success !== true) {
            throw new Error(data?.error || "API returned unsuccessful response");
        }

        // Only a valid successful response can update the scoreboard.
        renderScoreData(data, false);
        saveLastSuccessfulData(data);

        setConnectionStatus("LIVE • SYNCED", "#6cf598");

    } catch (err) {
        // NEVER clear the scoreboard here.
        // Last successful data stays visible.
        const msg = err?.message || "Network error";

        if (err?.name === "AbortError") {
            setConnectionStatus("RETRYING • API TIMEOUT", "#ffd700");
        } else if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
            setConnectionStatus("RECONNECTING • NETWORK", "#ffd700");
        } else {
            setConnectionStatus("RECONNECTING • " + msg.slice(0, 38), "#ffd700");
        }

    } finally {
        clearTimeout(timeoutId);
        fetchInProgress = false;

        // 3 seconds AFTER the current request finishes.
        scheduleNextFetch(POLL_INTERVAL);
    }
}


/* Manual match switch:
   A new match is intentionally allowed to clear the old match,
   then the new match is loaded. Automatic failures never clear data. */
async function triggerMatchLoad() {
    let rawVal = urlInput.value.trim();

    if (!rawVal) {
        alert("Please enter a valid CREX URL or Match ID");
        return;
    }

    const target = normalizeInput(rawVal);
    activeTargetUrl = target;
    localStorage.setItem("crex_match_input", target);

    urlInput.value = target;

    // Stop the current retry timer so the new match starts immediately.
    if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
    }

    // New match = clear the old match deliberately.
    flushDomElementsInstantly();

    // Restore cached data for this exact match immediately, if available.
    restoreLastSuccessfulData();

    setConnectionStatus("SCRAPING LIVE DATA...", "#ffd700");

    try {
        await fetch(`${API_BASE}/api/default-url`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: target })
        });
    } catch (e) {
        // The scrape endpoint can still work even if default-url POST fails.
    }

    fetchScores();
}

document.getElementById("loadMatchUrlBtn").addEventListener("click", triggerMatchLoad);

urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") triggerMatchLoad();
});

if (urlParams.get("hide") === "1") {
    document.getElementById("urlControlBar").style.display = "none";
}

/* =========================================================
   STARTUP
   ========================================================= */

window.addEventListener("load", () => {
    // Show last successful score immediately, if this match was cached.
    const restored = restoreLastSuccessfulData();

    if (restored) {
        setConnectionStatus("Cached • Connecting...", "#ffd700");
    } else {
        setConnectionStatus("SCRAPING LIVE DATA...", "#ffd700");
    }

    // Start the live request immediately.
    fetchScores();
});

</script>
