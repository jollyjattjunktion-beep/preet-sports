<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preet Sports Live Scoreboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}
h1{font-size:24px;margin:0 0 14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
input{flex:1;min-width:280px;padding:12px;border:1px solid #303844;border-radius:8px;background:#151b23;color:#fff}
button{padding:12px 18px;border:0;border-radius:8px;background:#e8a317;color:#111;font-weight:700;cursor:pointer}
.status{font-size:13px;color:#9da8b5;margin-bottom:12px}
.card{background:#151b23;border:1px solid #28313c;border-radius:14px;padding:20px}
.header{text-align:center;margin-bottom:20px}
.title{font-size:20px;font-weight:700}
.sub{font-size:13px;color:#9da8b5;margin-top:5px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.team{text-align:center}
.team img{width:58px;height:58px;object-fit:contain}
.team-name{font-weight:700;margin:7px 0}
.score{font-size:32px;font-weight:800}
.overs{font-size:14px;color:#aab4c0}
.vs{font-size:18px;font-weight:800;color:#e8a317}
.statusbox{text-align:center;margin:20px 0;padding:12px;background:#0e1319;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#0e1319;border-radius:9px;padding:12px;text-align:center}
.label{font-size:11px;color:#8f9aa7;text-transform:uppercase}
.value{font-size:18px;font-weight:700;margin-top:5px}
.section{margin-top:20px}
.section h2{font-size:16px;margin:0 0 10px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:#0e1319;border-radius:10px;padding:12px}
.player img{width:42px;height:42px;object-fit:cover;border-radius:50%;float:left;margin-right:10px}
.muted{color:#8f9aa7;font-size:12px}
.over{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ball{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#303844;font-size:12px;font-weight:700}
.ball.four{background:#1d8f55}.ball.six{background:#287bc7}.ball.wicket{background:#d83b3b}.ball.extra{background:#a06a19}.ball.run{background:#46515e}
@media(max-width:650px){
 .teams{grid-template-columns:1fr 50px 1fr}
 .score{font-size:24px}.stats{grid-template-columns:1fr 1fr}.players{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🏏 Preet Sports Live Scoreboard</h1>
<div class="controls">
<input id="url" placeholder="Paste Crex match URL here">
<button onclick="start()">LOAD MATCH</button>
</div>
<div class="status" id="status">Enter a Crex match URL.</div>

<div class="card" id="scorecard" style="display:none">
  <div class="header">
    <div class="title" id="matchTitle">Live Match</div>
    <div class="sub" id="series"></div>
    <div class="sub" id="venue"></div>
  </div>

  <div class="teams">
    <div class="team">
      <img id="logo1" src="" onerror="this.style.display='none'">
      <div class="team-name" id="team1"></div>
      <div class="score" id="score1">-</div>
      <div class="overs" id="overs1"></div>
    </div>
    <div class="vs">VS</div>
    <div class="team">
      <img id="logo2" src="" onerror="this.style.display='none'">
      <div class="team-name" id="team2"></div>
      <div class="score" id="score2">-</div>
      <div class="overs" id="overs2"></div>
    </div>
  </div>

  <div class="statusbox" id="equation">Waiting for data...</div>

  <div class="stats">
    <div class="stat"><div class="label">CRR</div><div class="value" id="crr">-</div></div>
    <div class="stat"><div class="label">RRR</div><div class="value" id="rrr">-</div></div>
    <div class="stat"><div class="label">Last Ball</div><div class="value" id="lastBall">-</div></div>
    <div class="stat"><div class="label">Partnership</div><div class="value" id="partnership">-</div></div>
  </div>

  <div class="section">
    <h2>Current Over</h2>
    <div class="over" id="currentOver"></div>
  </div>

  <div class="section">
    <h2>Batters</h2>
    <div class="players" id="batters"></div>
  </div>

  <div class="section">
    <h2>Bowler</h2>
    <div class="players" id="bowler"></div>
  </div>
</div>
</div>

<script>
let matchUrl="";
let timer=null;

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

async function loadData(){
  if(!matchUrl)return;
  $("status").textContent="Updating live data…";
  try{
    const r=await fetch("/api/scrape?url="+encodeURIComponent(matchUrl),{cache:"no-store"});
    const d=await r.json();
    if(!d.success) throw new Error(d.error||"Scrape failed");
    render(d);
    $("status").textContent="Live • Updated "+new Date().toLocaleTimeString();
  }catch(e){
    $("status").textContent="Error: "+e.message;
  }
}

function render(d){
 $("scorecard").style.display="block";
 $("matchTitle").textContent=d.vs_text||d.match_title||"Live Match";
 $("series").textContent=d.match_title||d.series_name||"";
 $("venue").textContent=d.venue||"";
 $("team1").textContent=d.team1?.short||d.team1?.name||"Team 1";
 $("team2").textContent=d.team2?.short||d.team2?.name||"Team 2";
 $("score1").textContent=d.team1?.score||"-";
 $("score2").textContent=d.team2?.score||"-";
 $("overs1").textContent=d.team1?.overs||"";
 $("overs2").textContent=d.team2?.overs||"";
 $("equation").textContent=d.equation||d.status||"";
 $("crr").textContent=d.crr||"-";
 $("rrr").textContent=d.rrr||"-";
 $("lastBall").textContent=d.last_ball||"-";
 $("partnership").textContent=d.partnership||"-";

 setLogo("logo1",d.team1?.logo);
 setLogo("logo2",d.team2?.logo);

 const ov=d.current_over;
 $("currentOver").innerHTML=ov?.balls?.length
   ? ov.balls.map(b=>`<span class="ball ${esc(b.type)}">${esc(b.text)}</span>`).join("")+`<span class="muted">${esc(ov.total||"")}</span>`
   : '<span class="muted">No over data</span>';

 const bs=[d.batsman1,d.batsman2].filter(Boolean);
 $("batters").innerHTML=bs.length?bs.map(p=>`
   <div class="player">
    ${p.img?`<img src="${esc(p.img)}" onerror="this.style.display='none'">`:""}
    <b>${esc(p.short_name||p.name)} ${p.on_strike?"*":""}</b><br>
    <span class="muted">${esc(p.runs)} (${esc(p.balls)}) • 4s ${esc(p.fours)} • 6s ${esc(p.sixes)} • SR ${esc(p.sr)}</span>
   </div>`).join(""):'<div class="muted">No batter data</div>';

 const b=d.bowler;
 $("bowler").innerHTML=b?`
   <div class="player">
    ${b.img?`<img src="${esc(b.img)}" onerror="this.style.display='none'">`:""}
    <b>${esc(b.short_name||b.name)}</b><br>
    <span class="muted">${esc(b.figures)} • Econ ${esc(b.econ)} • ${esc(b.overs)}</span>
   </div>`:'<div class="muted">No bowler data</div>';
}
function setLogo(id,url){
 const e=$(id);
 if(url){e.src=url;e.style.display="inline-block"}else e.style.display="none";
}
function start(){
 const v=$("url").value.trim();
 if(!v){$("status").textContent="Please paste a Crex match URL.";return}
 matchUrl=v;
 if(timer)clearInterval(timer);
 loadData();
 timer=setInterval(loadData,10000);
}
</script>
</body>
</html>
